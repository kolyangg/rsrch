run_config_overrides:
  photomaker_baseline:
    report: {method: PhotoMaker V2, schedule: none, trainables: released PM, topology: standard PM}
    model: {use_id_loss: false}
  ba_NN1a_n3a_replay_1gpu/ba_NN1a_n3a_replay_1gpu_step6000: &nn1a
    report: {method: N3a replay, schedule: all diffusion timesteps, trainables: SA QKV + CA QKV, topology: full doubled spatial BA}
    model: {use_id_loss: false, ba_face_prompt_attention_mask: false}
  ba_NN1a_n3a_replay_1gpu/ba_NN1a_n3a_replay_1gpu_step10000: *nn1a
  ba_NN1b_schedule_matched_1gpu/ba_NN1b_schedule_matched_1gpu_step2000: &nn1b
    report: {method: schedule-matched BA, schedule: inference BA region only, trainables: SA QKV + CA QKV, topology: full doubled spatial BA}
    model: {use_id_loss: false, ba_face_prompt_attention_mask: false}
  ba_NN1b_schedule_matched_1gpu/ba_NN1b_schedule_matched_1gpu_step6000: *nn1b
  ba_NN1b_schedule_matched_1gpu/ba_NN1b_schedule_matched_1gpu_step10000: *nn1b
  ba_NN1c_masked_id_prompt_1gpu/ba_NN1c_masked_id_prompt_1gpu_step6000: &nn1c
    report: {method: masked ID prompt, schedule: all diffusion timesteps, trainables: SA QKV + CA QKV, topology: full doubled spatial BA}
    model: {use_id_loss: false, ba_face_prompt_attention_mask: true}
  ba_NN1c_masked_id_prompt_1gpu/ba_NN1c_masked_id_prompt_1gpu_step10000: *nn1c
  ba_NN1d_frozen_ca_1gpu/ba_NN1d_frozen_ca_1gpu_step2000: &nn1d
    report: {method: frozen branched CA, schedule: all diffusion timesteps, trainables: SA QKV only, topology: full doubled spatial BA}
    model: {use_id_loss: false, ba_face_prompt_attention_mask: false}
  ba_NN1d_frozen_ca_1gpu/ba_NN1d_frozen_ca_1gpu_step6000: *nn1d
  ba_NN1d_frozen_ca_1gpu/ba_NN1d_frozen_ca_1gpu_step10000: *nn1d
  ba_NN1e_frozen_ca_id_loss_1gpu/ba_NN1e_frozen_ca_id_loss_1gpu_step2000: &nn1e
    report: {method: frozen CA + ID loss, schedule: all diffusion timesteps, trainables: SA QKV only, topology: full doubled spatial BA}
    model: {use_id_loss: true, id_loss_weight: 0.1, id_loss_max_timestep: 400, ba_face_prompt_attention_mask: false}
  ba_NN1e_frozen_ca_id_loss_1gpu/ba_NN1e_frozen_ca_id_loss_1gpu_step6000: *nn1e
  ba_NN1e_frozen_ca_id_loss_1gpu/ba_NN1e_frozen_ca_id_loss_1gpu_step10000: *nn1e
  ba_NN1f_ref_kv_id_loss_1gpu/ba_NN1f_ref_kv_id_loss_1gpu_step2000: &nn1f
    report: {method: ref-KV + ID loss, schedule: all diffusion timesteps, trainables: SA reference K/V only, topology: full doubled spatial BA}
    model: {use_id_loss: true, id_loss_weight: 0.1, id_loss_max_timestep: 400, ba_face_prompt_attention_mask: false}
  ba_NN1f_ref_kv_id_loss_1gpu/ba_NN1f_ref_kv_id_loss_1gpu_step6000: *nn1f
  ba_NN1f_ref_kv_id_loss_1gpu/ba_NN1f_ref_kv_id_loss_1gpu_step10000: *nn1f

config_criteria:
  - {label: method, path: report.method}
  - {label: checkpoint, path: metric.step}
  - {label: mean ID sim (secondary), path: metric.mean_id_sim}
  - {label: BA training schedule, path: report.schedule}
  - {label: trainable projections, path: report.trainables}
  - {label: forward topology, path: report.topology}
  - {label: decoded reference-ID loss, path: computed.id_loss}
  - {label: explicit ID-token mask, path: model.ba_face_prompt_attention_mask}

