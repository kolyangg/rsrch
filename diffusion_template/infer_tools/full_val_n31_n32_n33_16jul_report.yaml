run_config_overrides:
  photomaker_baseline: &pm
    report: {method: PhotoMaker only, target_path: standard PM, BA_memory: none, spatial_ref_UNet: no, fusion: none, global_batch: n/a, approximate_samples: n/a}
    model: {ba_ca_mode: standard, ba_pm_preservation_mode: native, ba_identity_dependence_mode: none, use_id_loss: false}
  ba_nr_alt_N3a:
    report: {method: hard spatial BA, target_path: absolute branched output, BA_memory: full reference latent/grid, spatial_ref_UNet: yes, fusion: hard hidden-state replacement, global_batch: 2, approximate_samples: 20k}
    model: {ba_ca_mode: legacy_ref_branch, ba_pm_preservation_mode: none, ba_identity_dependence_mode: none, use_id_loss: false}
  ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step10000:
    report: {method: learned dual gate, target_path: gated PM/ref absolute outputs, BA_memory: full reference grid, spatial_ref_UNet: yes, fusion: learned absolute-output gate, global_batch: 2, approximate_samples: 20k}
    model: {ba_ca_mode: legacy_ref_branch, ba_pm_preservation_mode: none, ba_identity_dependence_mode: none, use_id_loss: true}
  ba_qformer_idtokens_N29/ba_qformer_idtokens_N29_step10000: &n29
    report: {method: target-only QFormer residual, target_path: PM plus hard-face delta, BA_memory: 2 frozen PM QFormer tokens, spatial_ref_UNet: no, fusion: zero-init CA residual, global_batch: 2, approximate_samples: 20k}
    model: {ba_ca_mode: target_face_residual, ba_identity_memory_mode: qformer_tokens, ba_identity_token_count: 2, ba_pm_preservation_mode: hard_epsilon_merge, ba_identity_dependence_mode: none, use_id_loss: true}
  ba_identity_dependence_4gpu_N31/ba_identity_dependence_4gpu_N31_step2000: &n31_2
    report: {method: QFormer plus correct/wrong ranking, target_path: PM plus hard-face delta, BA_memory: 2 frozen PM QFormer tokens, spatial_ref_UNet: no, fusion: zero-init CA residual, global_batch: 8, approximate_samples: 16k}
    model: {ba_ca_mode: target_face_residual, ba_identity_memory_mode: qformer_tokens, ba_identity_token_count: 2, ba_pm_preservation_mode: hard_epsilon_merge, ba_identity_dependence_mode: paired_wrong_reference, ba_identity_dependence_weight: 0.25, ba_identity_dependence_margin: 0.02, use_id_loss: true}
  ba_identity_dependence_4gpu_N31/ba_identity_dependence_4gpu_N31_step6000:
    <<: *n31_2
    report: {method: QFormer plus correct/wrong ranking, target_path: PM plus hard-face delta, BA_memory: 2 frozen PM QFormer tokens, spatial_ref_UNet: no, fusion: zero-init CA residual, global_batch: 8, approximate_samples: 48k}
  ba_identity_dependence_4gpu_N31/ba_identity_dependence_4gpu_N31_step10000:
    <<: *n31_2
    report: {method: QFormer plus correct/wrong ranking, target_path: PM plus hard-face delta, BA_memory: 2 frozen PM QFormer tokens, spatial_ref_UNet: no, fusion: zero-init CA residual, global_batch: 8, approximate_samples: 80k}
  ba_identity_dependence_4gpu_N31/ba_identity_dependence_4gpu_N31_step12000:
    <<: *n31_2
    report: {method: QFormer plus correct/wrong ranking, target_path: PM plus hard-face delta, BA_memory: 2 frozen PM QFormer tokens, spatial_ref_UNet: no, fusion: zero-init CA residual, global_batch: 8, approximate_samples: 96k}
  ba_facepatch_resampler_N32/ba_facepatch_resampler_N32_step2000: &n32_2
    report: {method: face-patch resampler residual, target_path: PM plus hard-face delta, BA_memory: 8 learned face-patch queries, spatial_ref_UNet: no, fusion: zero-init CA residual, global_batch: 2, approximate_samples: 4k}
    model: {ba_ca_mode: target_face_residual, ba_identity_memory_mode: face_patch_resampler, ba_identity_token_count: 8, ba_pm_preservation_mode: hard_epsilon_merge, ba_identity_dependence_mode: none, use_id_loss: true}
  ba_facepatch_resampler_N32/ba_facepatch_resampler_N32_step6000:
    <<: *n32_2
    report: {method: face-patch resampler residual, target_path: PM plus hard-face delta, BA_memory: 8 learned face-patch queries, spatial_ref_UNet: no, fusion: zero-init CA residual, global_batch: 2, approximate_samples: 12k}
  ba_facepatch_resampler_N32/ba_facepatch_resampler_N32_step10000:
    <<: *n32_2
    report: {method: face-patch resampler residual, target_path: PM plus hard-face delta, BA_memory: 8 learned face-patch queries, spatial_ref_UNet: no, fusion: zero-init CA residual, global_batch: 2, approximate_samples: 20k}
  ba_facepatch_resampler_N32/ba_facepatch_resampler_N32_step16000:
    <<: *n32_2
    report: {method: face-patch resampler residual, target_path: PM plus hard-face delta, BA_memory: 8 learned face-patch queries, spatial_ref_UNet: no, fusion: zero-init CA residual, global_batch: 2, approximate_samples: 32k}
  ba_qformer_continue40k_N33/ba_qformer_continue40k_N33_step14000: &n33_14
    report: {method: unchanged N29 continuation, target_path: PM plus hard-face delta, BA_memory: 2 frozen PM QFormer tokens, spatial_ref_UNet: no, fusion: zero-init CA residual, global_batch: 2, approximate_samples: 28k}
    model: {ba_ca_mode: target_face_residual, ba_identity_memory_mode: qformer_tokens, ba_identity_token_count: 2, ba_pm_preservation_mode: hard_epsilon_merge, ba_identity_dependence_mode: none, use_id_loss: true}
  ba_qformer_continue40k_N33/ba_qformer_continue40k_N33_step20000:
    <<: *n33_14
    report: {method: unchanged N29 continuation, target_path: PM plus hard-face delta, BA_memory: 2 frozen PM QFormer tokens, spatial_ref_UNet: no, fusion: zero-init CA residual, global_batch: 2, approximate_samples: 40k}
  ba_qformer_continue40k_N33/ba_qformer_continue40k_N33_step24000:
    <<: *n33_14
    report: {method: unchanged N29 continuation, target_path: PM plus hard-face delta, BA_memory: 2 frozen PM QFormer tokens, spatial_ref_UNet: no, fusion: zero-init CA residual, global_batch: 2, approximate_samples: 48k}
  ba_qformer_continue40k_N33/ba_qformer_continue40k_N33_step26000:
