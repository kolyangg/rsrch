# N23/N24 checkpoint evolution against PhotoMaker and the plain N17 BA baseline.

results_dir: full_validation_results
refs_dir: ../dataset_full/val_dataset/references
prompts: ../dataset_full/val_dataset/prompts_10.txt
classes: ../dataset_full/val_dataset/classes_ref.json
out_pdf: full_validation_results/ba_n23_n24_13Jul/full_val_report_N23_N24_steps_vs_PM_N17.pdf
saved_dir: saved
title: N23 CAMIX and N24 dual-gate evolution vs PhotoMaker and N17
trigger_word: img
require_complete_grid: true

runs:
  - photomaker_baseline
  - ba_longrun_N17
  - ba_camix_train_N23_steps/ba_camix_train_N23_step1000
  - ba_camix_train_N23_steps/ba_camix_train_N23_step5000
  - ba_camix_train_N23_steps/ba_camix_train_N23_step10000
  - ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step1000
  - ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step5000
  - ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step10000

labels:
  photomaker_baseline: PhotoMaker V2
  ba_longrun_N17: N17 plain BA 26k
  ba_camix_train_N23_steps/ba_camix_train_N23_step1000: N23 CAMIX 1k
  ba_camix_train_N23_steps/ba_camix_train_N23_step5000: N23 CAMIX 5k
  ba_camix_train_N23_steps/ba_camix_train_N23_step10000: N23 CAMIX 10k
  ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step1000: N24 dual gate 1k
  ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step5000: N24 dual gate 5k
  ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step10000: N24 dual gate 10k

metrics_sources:
  photomaker_baseline: {path: full_validation_results/metrics_photomaker_baseline.json, key: photomaker_baseline}
  ba_longrun_N17: {path: full_validation_results/metrics_ba_longrun_N17.json, key: ba_longrun_N17}
  ba_camix_train_N23_steps/ba_camix_train_N23_step1000: {path: full_validation_results/ba_camix_train_N23_steps/metrics_ba_camix_train_N23_steps.json, key: ba_camix_train_N23_step1000}
  ba_camix_train_N23_steps/ba_camix_train_N23_step5000: {path: full_validation_results/ba_camix_train_N23_steps/metrics_ba_camix_train_N23_steps.json, key: ba_camix_train_N23_step5000}
  ba_camix_train_N23_steps/ba_camix_train_N23_step10000: {path: full_validation_results/ba_camix_train_N23_steps/metrics_ba_camix_train_N23_steps.json, key: ba_camix_train_N23_step10000}
  ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step1000: {path: full_validation_results/ba_dualgate_train_N24_steps/metrics_ba_dualgate_train_N24_steps.json, key: ba_dualgate_train_N24_step1000}
  ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step5000: {path: full_validation_results/ba_dualgate_train_N24_steps/metrics_ba_dualgate_train_N24_steps.json, key: ba_dualgate_train_N24_step5000}
  ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step10000: {path: full_validation_results/ba_dualgate_train_N24_steps/metrics_ba_dualgate_train_N24_steps.json, key: ba_dualgate_train_N24_step10000}

config_aliases:
  ba_camix_train_N23_steps/ba_camix_train_N23_step1000: ba_camix_train_N23
  ba_camix_train_N23_steps/ba_camix_train_N23_step5000: ba_camix_train_N23
  ba_camix_train_N23_steps/ba_camix_train_N23_step10000: ba_camix_train_N23
  ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step1000: ba_dualgate_train_N24
  ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step5000: ba_dualgate_train_N24
  ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step10000: ba_dualgate_train_N24

run_config_overrides:
  photomaker_baseline:
    report: {method: PhotoMaker only, training: released V2}
    trainer: {epoch_len: 0, n_epochs: 0}
    pipeline: {ba_enable_runtime_sa_knobs: false, pose_adapt_ratio: 0, ca_mixing_for_face: false, ba_face_fusion_mode: none}
    model: {use_id_loss: false, use_id_embeds: false}
  ba_longrun_N17:
    report: {method: plain BA, training: N17 26k}
    pipeline: {ba_enable_runtime_sa_knobs: false, pose_adapt_ratio: 0, ca_mixing_for_face: false, ba_face_fusion_mode: legacy}
  ba_camix_train_N23_steps/ba_camix_train_N23_step1000: &n23
    report: {method: CAMIX trained, training: N23 10k}
    trainer: {epoch_len: 1000, n_epochs: 10}
    loss_kind: blended_masked
    lambda_face: 0.15
    train_ba_all_steps: true
    train_branched_ca_lora: false
    branched_attn_weight_mode: noise_and_ref
    ba_noise_lr_scale: 0.1
    pipeline: {ba_enable_runtime_sa_knobs: true, pose_adapt_ratio: 0, ca_mixing_for_face: true, ba_face_fusion_mode: legacy}
    model: {use_id_loss: true, id_loss_weight: 0.1, id_loss_max_timestep: 500, use_id_embeds: false}
    lr_for_lora: 0.0001
  ba_camix_train_N23_steps/ba_camix_train_N23_step5000: *n23
  ba_camix_train_N23_steps/ba_camix_train_N23_step10000: *n23
  ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step1000: &n24
    report: {method: learned dual gate, training: N24 10k}
    trainer: {epoch_len: 1000, n_epochs: 10}
    loss_kind: blended_masked
    lambda_face: 0.15
    train_ba_all_steps: false
    train_branched_ca_lora: false
    branched_attn_weight_mode: noise_and_ref
    ba_noise_lr_scale: 0.1
    pipeline: {ba_enable_runtime_sa_knobs: false, pose_adapt_ratio: 0, ca_mixing_for_face: false, ba_face_fusion_mode: dual_attention_gate, ba_face_fusion_gate_init: 0.2, ba_face_fusion_gate_max: 0.5}
    model: {use_id_loss: true, id_loss_weight: 0.1, id_loss_max_timestep: 500, use_id_embeds: false}
    lr_for_lora: 0.0001
  ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step5000: *n24
  ba_dualgate_train_N24_steps/ba_dualgate_train_N24_step10000: *n24

config_criteria:
  - {label: method, path: report.method}
  - {label: checkpoint step, path: metric.step}
  - {label: 96-val mean id-sim, path: metric.mean_id_sim}
  - {label: faces detected, path: metric.n_faces_detected}
  - {label: train schedule, path: computed.train_schedule}
  - {label: loss kind, path: loss_kind}
  - {label: face loss lambda, path: lambda_face}
  - {label: ID loss, path: computed.id_loss}
  - {label: train BA all denoise stages, path: train_ba_all_steps}
  - {label: train BA cross-attn, path: computed.train_ba_ca}
  - {label: BA weight mode, path: branched_attn_weight_mode}
  - {label: BA noise LR scale, path: ba_noise_lr_scale}
  - {label: runtime SA knobs, path: pipeline.ba_enable_runtime_sa_knobs, default: false}
  - {label: pose adapt ratio, path: pipeline.pose_adapt_ratio, default: 0}
  - {label: CAMIX face K/V, path: pipeline.ca_mixing_for_face, default: false}
  - {label: face fusion mode, path: pipeline.ba_face_fusion_mode}
  - {label: gate init, path: pipeline.ba_face_fusion_gate_init}
  - {label: gate maximum, path: pipeline.ba_face_fusion_gate_max}
  - {label: ID embedding conditioning, path: model.use_id_embeds, default: false}
  - {label: LoRA LR, path: lr_for_lora}

cell_px: 225
label_px: 235
config_row_px: 58
config_label_px: 250
config_col_px: 170
dpi: 150

