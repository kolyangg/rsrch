blueprint:
  status: design_only_non_runnable
  priority: 5
  proposed_config: CL25_cosmic_low_noise_id_reward_4k
  proposed_run: CL25_cosmic_low_noise_id_reward_4k_full96_r1
  control_run: CL19_cosmic_true_soft_fullquery_router_24k_full96_r1
  control_comet_key: cfeda7b55c174b3c83e8d40537ebb6dd
  single_delta: >-
    Continue the exact CL19 24k model for 4k local steps with a pathwise ArcFace
    reward backpropagated through only the final four DDIM steps and constrained
    to a frozen CL19 trajectory.
  rationale: >-
    E22's one-step noisy x0 identity loss failed. ReF-LDM, portrait reward
    optimization, and IPRO independently indicate that identity gradients are
    most useful at low noise and require trajectory/KL anchoring.

hydra_child:
  defaults:
    - CL19_cosmic_true_soft_fullquery_router_24k
    - _self_
  initialization:
    weights_from_run: CL19_cosmic_true_soft_fullquery_router_24k_full96_r1
    weights_checkpoint_step: 24000
    weights_checkpoint_sha256: TO_PIN
    reset_optimizer: true
    reset_scheduler: true
    comet_local_step_zero_is_source_checkpoint: true
  trainer:
    epoch_len: 2000
    n_epochs: 2
    validation_interval_steps: 2000
  model:
    ba_low_noise_id_reward_enabled: true
    ba_low_noise_id_reward_probability: 0.0625
    ba_low_noise_id_reward_last_steps: 4
    ba_low_noise_id_reward_weight: 0.05
    ba_low_noise_id_reward_kl_weight: 1.0
    ba_low_noise_id_reward_reference_pool: same_identity_centroid
    ba_low_noise_id_reward_min_reference_faces: 3
    ba_low_noise_id_reward_face_quality_floor: 0.50
    ba_low_noise_id_reward_skip_on_detection_failure: true
    ba_low_noise_id_reward_frozen_anchor: source_CL19_24k
  pipeline:
    pose_adapt_ratio: 0.0
    ca_mixing_for_face: false
  expected_trainable_contract:
    enabled: true
    total_tensors: 2240
    total_parameters: 219217920

reward_definition:
  identity: R_id = cosine(ArcFace(differentiable_face_crop(x0)), same_ID_centroid)
  anchor: L_kl = sum_last4(weight_t * mse(epsilon_candidate, stopgrad(epsilon_frozen_CL19)))
  total: L = L_standard + 0.05 * (1 - R_id) + 1.0 * L_kl
  guard: >-
    Generate the prefix under no-grad, retain the graph only for the final four
    DDIM steps, and use a distinct same-ID pool rather than the conditioning
    crop to reduce copy-pose reward hacking.

implementation:
  code_delta: >-
    Add a training-only low-noise trajectory helper. Use fixed differentiable
    bbox alignment into ArcFace; the detector cannot sit in the gradient path.
    The frozen CL19 anchor uses the same latent, text, reference, scheduler, and
    four timesteps. Alternate sparse reward batches with standard diffusion
    batches rather than replacing the denoising objective.
  modify:
    - src/model/photomaker_branched/lora2.py
    - src/loss/diffusion_loss.py
    - src/trainer/sdxl_trainers.py
  startup_gates:
    - local step-zero validation reproduces CL19 24k exactly
    - source checkpoint hash and schema-v2 trainable ownership are pinned
    - ArcFace, frozen CL19 anchor, and reference-pool tensors are not optimized
    - reward gradient is nonzero on BA/default adapter parameters at low noise
    - zero reward weight reproduces the source continuation path

telemetry_required:
  - loss_ba_id_reward
  - loss_ba_id_reward_kl
  - ba/id_reward_cosine
  - ba/id_reward_face_valid_fraction
  - ba/id_reward_grad_norm
  - ba/id_reward_trajectory_divergence

serv_plan:
  gpus: 1
  accelerator: A100
  local_optimizer_steps: 4000
  epoch_len: 2000
  validation_interval_steps: 2000
  expected_compute: >-
    Reward batches are sparse because each requires a no-grad sampling prefix
    and four differentiable steps; measure throughput and memory in a one-batch
    smoke before packaging.

promotion_gate:
  primary: >-
    Positive paired ID delta at local 2k and 4k, confirmed by an independent
    face encoder diagnostic and without loss of TOPIQ-Face, expression, or text.
  stretch_target: subject-v2 ID at or above PhotoMaker 0.5565802762
  reject_if: >-
    ID_sim rises only on the optimized ArcFace encoder, faces become rigid or
    copy the reference pose, trajectory KL runs away, or occluder topology worsens.

