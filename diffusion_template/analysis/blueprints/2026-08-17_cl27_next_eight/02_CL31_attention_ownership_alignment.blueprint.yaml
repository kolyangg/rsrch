# DESIGN ONLY - implement and validate before copying into src/configs.
defaults:
  - CL27_cosmic_frequency_surface_energy_24k
  - _self_

pipeline:
  pose_adapt_ratio: 0.0
  ca_mixing_for_face: false

trainer:
  epoch_len: 2000
  n_epochs: 12
  validation_interval_steps: 2000
  skip_initial_validation: false
  active_grad_norm_mode: requested_only

model:
  ba_hardcase_telemetry_enabled: false
  ba_attention_ownership_loss_enabled: true
  ba_attention_ownership_groups: [up_blocks.0, up_blocks.1]
  ba_attention_ownership_probability: 0.25
  ba_attention_ownership_weight: 0.02
  ba_attention_ownership_visible_ref_mass_floor: 0.55
  ba_attention_ownership_top_ref_mass_ceiling: 0.10
  ba_attention_ownership_contact_width: 1
  ba_attention_ownership_sample_on_cpu: true

datasets:
  train:
    cosmic_large_adapted:
      semantic_occlusion_probability: 0.25
      semantic_occlusion_seed: 150017

expected_trainable_contract:
  enabled: true
  total_tensors: 2240
  total_parameters: 219217920
  optimizer_tensors: 2240
  optimizer_parameters: 219217920

writer:
  loss_names:
    - loss
    - loss_ba_aux
    - loss_ba_frequency_surface
    - loss_ba_attention_ownership
    - ba/attention_visible_ref_mass/up0
    - ba/attention_visible_ref_mass/up1
    - ba/attention_top_ref_mass/up0
    - ba/attention_top_ref_mass/up1
    - ba/attention_ownership_applied_fraction
  experiment_comment: >-
    CL31 vs CL27 adds only a sampled attention-level ownership loss: visible
    face queries must retrieve the reference-face key region, while synthetic
    top-object/contact queries must route to the zero/native alternative.
