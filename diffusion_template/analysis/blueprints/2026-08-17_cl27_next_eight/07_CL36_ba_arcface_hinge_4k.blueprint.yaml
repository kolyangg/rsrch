# DESIGN ONLY - 4k continuation from the exact immutable CL27 r3 16k checkpoint.
defaults:
  - CL27_cosmic_frequency_surface_energy_24k
  - _self_

pipeline:
  pose_adapt_ratio: 0.0
  ca_mixing_for_face: false

trainer:
  from_pretrained: ${oc.env:CL36_SOURCE_CHECKPOINT}
  epoch_len: 2000
  n_epochs: 2
  validation_interval_steps: 2000
  skip_initial_validation: false
  active_grad_norm_mode: requested_only

lr_scheduler:
  _target_: src.lr_schedulers.lr_schedulers.WarmupHoldCosineLR
  warmup_steps: 20
  hold_steps: 2000
  total_steps: 4000
  min_factor: 0.1

model:
  ba_hardcase_telemetry_enabled: false
  identity_aux_enabled: true
  identity_aux_backend: arcface_torch_v2
  identity_aux_model_path: ${oc.env:ARCFACE_ONNX_PATH,/home/jovyan/.insightface/models/buffalo_l/w600k_r50.onnx}
  identity_aux_model_sha256: 4c06341c33c2ca1f86781dab0e829f88ad5b64be9fba56e56bc9ebdefc619e43
  identity_aux_mode: quadratic_hinge
  identity_aux_hinge_margin: 0.55
  identity_aux_cadence: 16
  identity_aux_max_timestep: 200
  identity_aux_max_weight: 0.01
  identity_aux_ramp_start_step: 0
  identity_aux_ramp_end_step: 100
  identity_aux_crop_padding: 0.25
  identity_aux_reference_mode: distinct_sameid_centroid
  identity_aux_gradient_scope: branched_sa_only
  identity_aux_grad_target_ratio: 0.025
  identity_aux_grad_norm_interval: 200
  ba_allow_objective_only_checkpoint_init: true

datasets:
  train:
    cosmic_large_adapted:
      num_identity_refs: 3

expected_trainable_contract:
  enabled: true
  total_tensors: 2240
  total_parameters: 219217920
  optimizer_tensors: 2240
  optimizer_parameters: 219217920
  identity_gradient_scope:
    branched_sa_r128: {tensors: 840, parameters: 127795200}

writer:
  loss_names:
    - loss
    - loss_ba_aux
    - loss_identity_hinge
    - identity_aux_cosine
    - identity_aux_applied
    - identity_aux_weight
    - identity_aux_grad_ratio_ba
  experiment_comment: >-
    CL36 continues immutable CL27-r3-16k for 4k local steps and adds only a
    sparse low-noise ArcFace quadratic hinge. Identity gradients are capped at
    2.5% of BA diffusion-gradient norm and cannot update generic/default paths.
