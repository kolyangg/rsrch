# DESIGN ONLY - training-only teacher; inference and checkpoint path remain CL27.
defaults:
  - CL27_cosmic_frequency_surface_energy_24k
  - _self_

pipeline:
  pose_adapt_ratio: 0.0
  ca_mixing_for_face: false

trainer:
  epoch_len: 2000
  n_epochs: 12
  validation_interval_steps: 2000
  skip_initial_validation: false
  active_grad_norm_mode: requested_only

model:
  ba_hardcase_telemetry_enabled: false
  ba_roi_teacher_distill_enabled: true
  ba_roi_teacher_distill_groups: [up_blocks.0, up_blocks.1]
  ba_roi_teacher_size: 32
  ba_roi_teacher_face_threshold_px: 256
  ba_roi_teacher_progress_min: 0.60
  ba_roi_teacher_probability: 0.125
  ba_roi_teacher_weight: 0.02
  ba_roi_teacher_stopgrad: true
  ba_roi_teacher_sample_on_cpu: true
  ba_roi_teacher_loss: smooth_l1_cosine

expected_trainable_contract:
  enabled: true
  total_tensors: 2240
  total_parameters: 219217920
  optimizer_tensors: 2240
  optimizer_parameters: 219217920

writer:
  loss_names:
    - loss
    - loss_ba_aux
    - loss_ba_frequency_surface
    - loss_ba_roi_teacher
    - ba/roi_teacher_eligible_fraction
    - ba/roi_teacher_applied_fraction
    - ba/roi_teacher_student_cosine/up0
    - ba/roi_teacher_student_cosine/up1
  experiment_comment: >-
    CL37 vs CL27 adds only a sampled stop-gradient ROI32 teacher on small-face
    up0/up1 messages. The ordinary CL27 branch learns the local message; no ROI
    residual or new inference parameter is saved.
