# DESIGN ONLY - train.py must map this loss_kind to the target below.
defaults:
  - CL27_cosmic_frequency_surface_energy_24k
  - _self_

pipeline:
  pose_adapt_ratio: 0.0
  ca_mixing_for_face: false

trainer:
  epoch_len: 2000
  n_epochs: 12
  validation_interval_steps: 2000
  skip_initial_validation: false
  active_grad_norm_mode: requested_only

model:
  ba_hardcase_telemetry_enabled: false

loss_kind: visibility_balanced_ba
loss_function:
  _target_: src.loss.visibility_balanced_loss.VisibilityBalancedBranchedLoss
  visible_face_weight: 0.75
  top_object_weight: 0.25
  contact_weight: 0.05
  contact_ring_width: 1
  full_weight: 0.05
  apply_partition_only_when_occluded: true
  include_ba_aux_loss: true

expected_trainable_contract:
  enabled: true
  total_tensors: 2240
  total_parameters: 219217920
  optimizer_tensors: 2240
  optimizer_parameters: 219217920

writer:
  loss_names:
    - loss
    - loss_visible_face
    - loss_top_object
    - loss_contact
    - loss_full
    - loss_ba_aux
    - loss_ba_frequency_surface
    - visibility_partition_applied_fraction
  experiment_comment: >-
    CL33 vs CL27 changes only the reconstruction criterion on synthetic
    occlusion batches: visible face and top object are normalized separately,
    with small contact/full guards. Non-occluded batches retain face-only MSE.
