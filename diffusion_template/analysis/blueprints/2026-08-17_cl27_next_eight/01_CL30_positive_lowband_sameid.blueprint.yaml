# DESIGN ONLY - implement and validate before copying into src/configs.
defaults:
  - CL27_cosmic_frequency_surface_energy_24k
  - _self_

pipeline:
  pose_adapt_ratio: 0.0
  ca_mixing_for_face: false

trainer:
  epoch_len: 2000
  n_epochs: 12
  validation_interval_steps: 2000
  skip_initial_validation: false
  active_grad_norm_mode: requested_only

model:
  ba_hardcase_telemetry_enabled: false
  # CL29-derived collector: sample on CPU and remove the wrong-ID repulsion.
  ba_frequency_positive_sameid_enabled: true
  ba_frequency_positive_sameid_groups: [mid_block, up_blocks.0, up_blocks.1]
  ba_frequency_positive_sameid_probability: 0.125
  ba_frequency_positive_sameid_weight: 0.01
  ba_frequency_positive_sameid_ramp_start_step: 2000
  ba_frequency_positive_sameid_ramp_end_step: 6000
  ba_frequency_positive_sameid_detach_target_query: true
  ba_frequency_positive_sameid_stopgrad_anchor: true
  ba_frequency_positive_sameid_sample_on_cpu: true

datasets:
  train:
    cosmic_large_adapted:
      same_identity_dual_reference: true
      min_reference_candidates_for_target: 3

expected_trainable_contract:
  enabled: true
  total_tensors: 2240
  total_parameters: 219217920
  optimizer_tensors: 2240
  optimizer_parameters: 219217920

writer:
  loss_names:
    - loss
    - loss_ba_aux
    - loss_ba_frequency_surface
    - loss_ba_positive_sameid
    - ba/positive_sameid_cosine/all
    - ba/positive_sameid_applied_fraction
  experiment_comment: >-
    CL30 vs CL27 adds only a sampled positive cosine pull between low-band
    spatial-BA messages from two distinct same-ID references under the same
    detached target query. No wrong-ID negative contributes gradient.
