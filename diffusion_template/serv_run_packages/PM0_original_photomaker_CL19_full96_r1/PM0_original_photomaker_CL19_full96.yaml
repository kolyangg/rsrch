defaults:
  - CL19_cosmic_true_soft_fullquery_router_24k
  - _self_

# Plain PhotoMaker V2 control for CL19. The validation path, base model,
# inputs, sampling, batching, and metrics are inherited unchanged; only the
# branched-attention runtime is disabled. Epoch zero means seeded pretrained
# initialization, with no checkpoint load and no optimizer step.
validation_only: true
validation_epochs: [0]
validation_checkpoint_paths: [null]

validation_args:
  use_branched_attention: false

writer:
  experiment_comment: >-
    PM0 original PhotoMaker V2 baseline on CL19's exact fixed manual_val-96
    contract. Uses RealVisXL V4.0, the pretrained PhotoMaker V2 default adapter,
    seed 0, identical prompts/references/subject-v2 embeddings, batch 12,
    DDIM50, CFG 5, and identical validation metrics; branched attention is the
    only disabled inference mechanism and no optimizer step is taken.
