schema_version: 1
kind: implementation_gated_experiment_blueprint
status: design_only_not_runnable
launchable: false
priority: 2
proposed_run_name: CL16_cosmic_clean_multiscale_ref_memory_24k
base_config: src/configs/CL14_cosmic_joint_shadow_sa128_softmask_24k.yaml

single_change: >-
  Add a bounded, clean, multi-scale reference feature memory alongside the
  existing CL14 noised-reference BA path.
hypothesis: >-
  Re-noising the single reference at every target timestep makes high-frequency
  identity evidence unreliable, especially for Marion and small/occluded faces.
  A once-per-image clean feature memory gives target queries a stable identity
  source while the unchanged CL14 lane retains spatial compatibility.

proposed_overlay:
  model:
    ba_clean_reference_memory:
      enabled: true
      cache_timestep: 1
      cache_text_condition: null_prompt
      cache_support: reference_face_only
      feature_stages: [mid_block, up_blocks.0, up_blocks.1]
      query_source: target_features
      key_value_source: cached_reference_features
      projection_rank: 64
      merge: bounded_residual_after_cl14_ba
      residual_gate_init: 0.0
      residual_gate_max: 0.20
      residual_norm: rms_match_cl14_branch
      cache_dtype: bf16
  pipeline:
    pose_adapt_ratio: 0.0
    ca_mixing_for_face: false

implementation:
  code_paths:
    - src/model/photomaker_branched/attn_processor_cleanest.py
    - src/model/photomaker_branched/branched_runtime.py
    - src/model/photomaker_branched/lora2.py
    - src/pipelines/photomaker_branched_clean.py
    - src/trainer/base_trainer.py
  invariants:
    - The original CL14 target-Q/reference-KV path remains active and unchanged.
    - Cached memory K/V are reference-only; target Q and target spatial layout stay native.
    - Memory magnitude is RMS-normalized and bounded before merge.
    - The reference key-mask/zero-sink contract is unchanged; this is not E1 true-key masking.
    - Cache creation, serialization metadata, and use are identical in train and validation.
  dated_comment_required: true

fixed_contract:
  optimizer_steps: 24000
  epoch_len: 2000
  batch_size: 2
  validation: fixed_manual_val_96_step0_and_every_2000
  inference_steps: 50
  corrected_subject_v2_metric: true
  unchanged_scheduler_prompts_seeds_refs_boxes: true

preflight:
  - Assert byte-identical CL14 output when the clean-memory gate is disabled.
  - Assert exactly one cache build per reference image per denoising call.
  - Measure per-layer native, CL14-BA, and memory RMS plus the bounded merge ratio.
  - Run correct-reference, wrong-reference, and zero-memory causal probes.
  - Save/load a checkpoint and verify cache projections and gates are restored.

intermediate_kill_rule: >-
  Stop after 8k if correct-versus-wrong-reference ROI sensitivity is no larger
  than CL14, if the learned mean memory gate stays below 0.01, or if overall
  identity trails matched CL14 by more than 0.010 without a Marion gain.
final_decision_gate:
  overall_subject_v2_id_min: 0.4661
  marion_subject_v2_id_min: 0.3800
  overall_topiq_face_min: 0.6800
  text_similarity_min: 26.17
  qualitative_requirements:
    - At least 7 of Marion's 12 pairs are preferred without frontal copy-paste.
    - No identity leakage into hair, goggles, hands, clothing, or background.

serv:
  requested_a100_gpus: 1
  project_gpu_ceiling: 6
  submission_authorized: false

evidence:
  - CL14 overall subject-v2 identity is 0.4561 and Marion is 0.3500.
  - DreamCache finds clean, cached multi-resolution U-Net features useful for personalization.
  - E1 showed that unbounded removal of zero sinks amplifies the reference branch and fails.

