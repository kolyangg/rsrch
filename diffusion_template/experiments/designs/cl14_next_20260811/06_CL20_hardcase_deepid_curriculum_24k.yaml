schema_version: 1
kind: implementation_gated_experiment_blueprint
status: design_only_not_runnable
launchable: false
priority: 6
proposed_run_name: CL20_cosmic_bigcelebs_hardcase_curriculum_24k
base_config: src/configs/CL14_cosmic_joint_shadow_sa128_softmask_24k.yaml

single_change: >-
  Keep the CL14 model exact and replace broad BigCelebs sampling with a small,
  deterministic hard-case/deep-identity curriculum followed by Cosmic re-anchoring.
hypothesis: >-
  BigCelebs diversity can help reference-view and hard-case coverage, but broad
  fixed-budget training underperforms because most identities are seen once and
  the corpus is portrait-heavy. A curated 20% auxiliary stratum can add useful
  same-ID pose, small-face, and occluder examples without replacing the stronger
  Cosmic distribution.

proposed_overlay:
  model: unchanged_from_cl14
  datasets:
    train:
      curriculum:
        steps_0_19999:
          cosmic_large_probability: 0.80
          bigcelebs_hardcase_probability: 0.20
        steps_20000_23999:
          cosmic_large_probability: 1.00
          bigcelebs_hardcase_probability: 0.00
      bigcelebs_hardcase:
        min_same_identity_images: 6
        require_different_target_reference_files: true
        quality_filters: [face_detected, sharp_reference, no_validation_overlap]
        balanced_strata:
          - pose_divergent_same_id
          - target_face_short_side_64_to_180px
          - visible_eyewear_hair_hand_or_action_occlusion
        deterministic_manifest_required: true
        manifest_hash_logged_to_comet: true
  pipeline:
    pose_adapt_ratio: 0.0
    ca_mixing_for_face: false

implementation:
  code_paths:
    - src/datasets
    - src/configs/datasets
    - src/trainer/base_trainer.py
  invariants:
    - Architecture, losses, optimizer, total steps, batch size, and validation are exact CL14.
    - BigCelebs never exceeds 20% and is absent for the final 4k re-anchoring phase.
    - Every auxiliary identity has repeated views; no one-shot broad sampling is allowed.
    - No manual_val identity or image hash may enter the training manifest.
    - The manifest and sampling schedule are immutable once the run starts.
  dated_comment_required: true

fixed_contract:
  optimizer_steps: 24000
  epoch_len: 2000
  batch_size: 2
  validation: fixed_manual_val_96_step0_and_every_2000
  inference_steps: 50
  corrected_subject_v2_metric: true
  unchanged_scheduler_prompts_seeds_refs_boxes: true

preflight:
  - Produce stratum counts, identity-depth histogram, face-size histogram, and sample contact sheets.
  - Hash target/reference files and prove zero overlap with manual_val.
  - Compose the schedule and count exactly 24k deterministic sampler decisions.
  - Confirm model state and trainable parameter inventory are byte-equivalent to CL14 at step 0.
  - Run a loader-only smoke through the 20k curriculum boundary.

intermediate_kill_rule: >-
  Stop after 8k if overall identity trails matched CL14 by more than 0.015 and
  neither Marion nor Jumping+Dancing improves by at least 0.010. Do not increase
  the BigCelebs fraction during the run.
final_decision_gate:
  overall_subject_v2_id_min: 0.4611
  marion_subject_v2_id_min: 0.3700
  small_face_subject_v2_id_min: 0.3650
  text_similarity_min: 26.17
  qualitative_requirements:
    - Hard-case gains survive the final 4k Cosmic-only phase.
    - No portrait-copy bias, face enlargement, or loss of action composition.

serv:
  requested_a100_gpus: 1
  project_gpu_ceiling: 6
  submission_authorized: false

evidence:
  - BigCelebs 24k endpoint identity was 0.4152 versus CL14's 0.4561.
  - BigCelebs has far more identities but much lower within-identity depth and far more portraits.
  - The ds2 policy slightly improved Marion but damaged Skiing; ds3 helped small/Crying quality but not overall identity.

