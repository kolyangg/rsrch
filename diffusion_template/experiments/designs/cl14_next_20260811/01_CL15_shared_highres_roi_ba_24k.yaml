schema_version: 1
kind: implementation_gated_experiment_blueprint
status: design_only_not_runnable
launchable: false
priority: 1
proposed_run_name: CL15_cosmic_shared_highres_roi_ba_24k
base_config: src/configs/CL14_cosmic_joint_shadow_sa128_softmask_24k.yaml

single_change: >-
  Add a shared high-resolution target/reference ROI BA path for small target
  faces; retain the complete CL14 global path unchanged.
hypothesis: >-
  Small faces fail because their face box collapses to only a few tokens in the
  deeper U-Net blocks. Evaluating the same explicit target-Q/reference-KV BA
  projections on a fixed-resolution face lattice should restore identity detail
  without changing pose, face size, or the scene outside the ROI.

proposed_overlay:
  model:
    ba_highres_roi:
      enabled: true
      trigger_target_face_short_side_px_lte: 160
      feature_stages: [up_blocks.0, up_blocks.1]
      roi_lattice_hw: [32, 32]
      query_source: target_feature_roi
      key_value_source: reference_feature_roi
      projection_mode: share_cl14_ba_rank128
      reference_timestep_source: current_cl14_noised_reference
      scatter_mode: inverse_grid_sample
      scatter_feather: cosine_2_cells
      residual_gate_init: 0.0
      residual_gate_max: 0.25
      residual_norm: rms_match_native
  pipeline:
    pose_adapt_ratio: 0.0
    ca_mixing_for_face: false

implementation:
  code_paths:
    - src/model/photomaker_branched/attn_processor_cleanest.py
    - src/model/photomaker_branched/branched_runtime.py
    - src/model/photomaker_branched/lora2.py
    - src/trainer/base_trainer.py
  invariants:
    - Target Q is sampled from target-coordinate features and never replaced.
    - K/V come from the reference ROI through explicit BA projections.
    - The normal CL14 full-grid output is preserved; the ROI path is a bounded residual.
    - Scatter residual is exactly zero outside the declared target face support.
    - Training and validation construct identical ROI grids and load identical gates.
  dated_comment_required: true

fixed_contract:
  optimizer_steps: 24000
  epoch_len: 2000
  batch_size: 2
  validation: fixed_manual_val_96_step0_and_every_2000
  inference_steps: 50
  corrected_subject_v2_metric: true
  unchanged_scheduler_prompts_seeds_refs_boxes: true

preflight:
  - Assert byte-identical output to CL14 when ba_highres_roi.enabled=false.
  - Assert target/ref ROI sampling and inverse scatter coordinates on synthetic boxes.
  - Assert zero residual outside ROI and a finite nonzero reference gradient inside it.
  - Save/load a checkpoint and compare deterministic validation output tensors.
  - Measure peak A100 memory at batch size 2 before making the config launchable.

intermediate_kill_rule: >-
  Stop after the 8k validation if mean Jumping+Dancing subject-v2 identity has
  not improved by at least 0.015 over the matched CL14 checkpoint, or if overall
  identity is lower by more than 0.010, or if target face-size ratio shifts by
  more than 10%.
final_decision_gate:
  overall_subject_v2_id_min: 0.4511
  small_face_subject_v2_id_min: 0.3849
  small_face_topiq_face_min: 0.6000
  detection_rate_min: 1.0
  qualitative_requirements:
    - Blind review prefers CL15 on at least 10 of 16 Jumping/Dancing pairs.
    - No new face enlargement, pasted-face seam, duplicated feature, or body mismatch.

serv:
  requested_a100_gpus: 1
  project_gpu_ceiling: 6
  submission_authorized: false

evidence:
  - CL14 Jumping+Dancing subject-v2 identity is approximately 0.3449.
  - CL14 small-face TOPIQ-Face is 0.5458.
  - The replicated 18-step ROI suffix improved non-Eddie CL9 identity by 0.0968.
  - RealisID independently supports crop-upsample-process-scatter local identity paths.

