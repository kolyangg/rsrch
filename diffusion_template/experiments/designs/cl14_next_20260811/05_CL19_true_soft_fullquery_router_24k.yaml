schema_version: 1
kind: implementation_gated_experiment_blueprint
status: design_only_not_runnable
launchable: false
priority: 5
proposed_run_name: CL19_cosmic_true_soft_fullquery_router_24k
base_config: src/configs/CL14_cosmic_joint_shadow_sa128_softmask_24k.yaml

single_change: >-
  Implement a mathematically correct continuous target ownership router instead
  of CL14's thresholded feathered target mask.
hypothesis: >-
  CL14's nominal 1/3 and 2/3 feather values are thresholded to binary inside BA
  processors, turning a two-cell ramp into a one-cell erosion. Computing full
  native and reference lanes and blending them once with a continuous signed-
  distance mask should improve boundary integration without weakening identity.

proposed_overlay:
  model:
    ba_target_router:
      mode: continuous_full_query_single_blend
      target_mask_source: signed_distance_face_box
      transition_cells: 2
      transition_curve: cosine
      native_lane: full_target_self_attention
      reference_lane:
        query_source: full_target_queries
        key_value_source: cl14_reference_features
      blend_count: 1
      reference_key_mask: unchanged_cl14_binary_zero_sink
      force_binary_reference_mask: true
  pipeline:
    pose_adapt_ratio: 0.0
    ca_mixing_for_face: false

implementation:
  code_paths:
    - src/model/photomaker_branched/attn_processor_cleanest.py
    - src/model/photomaker_branched/branch_helpers.py
    - src/model/photomaker_branched/lora2.py
    - src/model/photomaker_branched/branched_runtime.py
  invariants:
    - Target routing mask and reference key mask are separate tensors and semantics.
    - Q is never multiplied by a soft mask before attention.
    - Native/reference outputs are each computed in full and blended exactly once.
    - The E1 true-reference-key mask remains disabled and zero sinks are preserved.
    - Legacy binary routing remains the default when the new mode is disabled.
  dated_comment_required: true

fixed_contract:
  optimizer_steps: 24000
  epoch_len: 2000
  batch_size: 2
  validation: fixed_manual_val_96_step0_and_every_2000
  inference_steps: 50
  corrected_subject_v2_metric: true
  unchanged_scheduler_prompts_seeds_refs_boxes: true

preflight:
  - Reproduce CL14's current binary erosion with a 6x6 synthetic face mask.
  - Assert mask weights are monotone and preserve 1/3 and 2/3 values after resize.
  - Assert exact native/reference limits at router weights 0/1 and one blend in between.
  - Compare legacy/new modes at a hard binary mask; outputs must match numerically.
  - Verify identical router construction during training and validation.

intermediate_kill_rule: >-
  Stop after 8k if overall identity is lower than matched CL14 by more than
  0.005 and neither mean mask IoU nor boundary face quality improves.
final_decision_gate:
  overall_subject_v2_id_min: 0.4511
  overall_topiq_face_min: 0.6864
  mean_mask_iou_min: 0.9050
  detection_rate_min: 1.0
  qualitative_requirements:
    - Fewer pasted-face seams and hairline/cheek boundary discontinuities than CL14.
    - No reference bleeding into hands, glasses, goggles, hair, clothing, or background.

serv:
  requested_a100_gpus: 1
  project_gpu_ceiling: 6
  submission_authorized: false

evidence:
  - CL14 config sets a two-cell feather, but BA processors default to force_binary_masks=true.
  - Thresholding a 1/3,2/3 ramp at 0.5 removes the outer ring and hardens the inner ring.
  - Simply disabling thresholding would double-apply a soft mask in the current processor and is not this experiment.

