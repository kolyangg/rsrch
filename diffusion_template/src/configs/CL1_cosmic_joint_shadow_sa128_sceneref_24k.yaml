defaults:
  - E13_large_ds_joint_shadow_sa128_24k
  - _self_

# CL1: exact E13 model/optimizer/validation contract on cosmic_large. The only
# scientific change is the training dataset: the reference is a native 1024px
# same-identity Cosmic target instead of a 256px face crop, which removes the
# measured 2.12x reference/target face-scale mismatch and the 4x upscale.
train_dataset_name: cosmic_large_sceneref
val_datasets_names: [manual_val]

datasets:
  train:
    cosmic_large_sceneref:
      min_face_res: 192
      random_horizontal_flip: true
      random_reference_flip: false
      prompt_mode: pose_first
      prompt_max_words: 50
  val:
    manual_val:
      limit: 96

writer:
  experiment_comment: >-
    CL1: exact E13 route on cosmic_large with native 1024px same-identity scene
    references built from a sealed offline ArcFace identity grouping. Isolates
    the reference-asset format from Cosmic content; no model, optimizer, loss,
    or validation change.
