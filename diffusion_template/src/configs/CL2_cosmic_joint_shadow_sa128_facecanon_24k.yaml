defaults:
  - E13_large_ds_joint_shadow_sa128_24k
  - _self_

# CL2: exact E13 contract on cosmic_large, keeping the existing 256px reference
# asset. The reference face is composited into the target face frame at the
# target scale BEFORE the VAE, so the frozen encoder sees it at the same
# granularity as the target. No model flag changes, so the step-zero panel must
# stay byte-identical to E13.
train_dataset_name: cosmic_large_adapted
val_datasets_names: [manual_val]

datasets:
  train:
    cosmic_large_adapted:
      min_face_res: 192
      # The frame policy alone owns reference geometry; these must stay null.
      reference_crop_margin: null
      reference_content_size: null
      reference_canvas_size: null
      reference_frame_mode: target_face_frame
      reference_frame_fill: edge
      random_horizontal_flip: true
      random_reference_flip: false
      prompt_mode: pose_first
      prompt_max_words: 50
  val:
    manual_val:
      limit: 96

writer:
  experiment_comment: >-
    CL2: exact E13 route on cosmic_large; the 256px reference face is composited
    into the target face frame at the target scale before the VAE, so the frozen
    encoder receives matched-granularity reference features. Tests whether a
    tight crop suffices once branched-lane geometry is normalized.
