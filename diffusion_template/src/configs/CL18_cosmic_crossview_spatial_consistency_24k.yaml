defaults:
  - cl18_cl20_extension_24k
  - _self_

# 12 Aug 2026 - CL18 changes training only; inference remains one-reference BA.
model:
  ba_crossview_consistency_enabled: true
  ba_crossview_consistency_probability: 0.25
  ba_crossview_consistency_weight: 0.05

datasets:
  train:
    cosmic_large_adapted:
      same_identity_dual_reference: true
      min_reference_candidates_for_target: 3

writer:
  experiment_comment: >-
    CL18 vs CL14 adds stop-gradient teacher/student prediction consistency for
    two same-identity spatial references while keeping target Q/noise/ID tokens
    fixed. Inference remains the exact single-reference CL14 architecture.
