defaults:
  - CL3_cosmic_joint_shadow_sa128_fmtfix_24k
  - _self_

# CL5 = CL3 + multi-reference PhotoMaker ID conditioning.
#
# CL3's early result shows its *typical* image already matches E13 on
# large_dataset (4k median .3755 vs .3901, and 21 images above .5 versus E13's
# 14). Its whole deficit is a 6-image catastrophic tail concentrated on jisoo
# and the kickboxing prompt. More independent identity evidence is the cheapest
# credible way to stabilise that tail, and cosmic_large is unusually well suited
# to supply it: every accepted target carries 2-10 same-person 256px crops, and
# a tight crop is the ideal input for the PhotoMaker ID lane (unlike the spatial
# lane, which CL3 already repairs).
#
# E18 gave +.03735 on large_dataset from the same mechanism.
#
# Invariant preserved: ref_images[0] stays the sole spatial latent/KV lane.
# The extra crops contribute ID tokens only.
datasets:
  train:
    cosmic_large_adapted:
      num_identity_refs: 3

model:
  # The batched conditioning path asserts exactly one reference per sample, so
  # multi-reference runs use the per-sample path — identical to how E19 handles
  # large_dataset_balanced_multiref. Execution grouping only; no maths changes.
  batched_conditioning_preparation: false

writer:
  experiment_comment: >-
    CL5: CL3 feature-space reference ROI warp plus three same-target PhotoMaker
    identity references. ref_images[0] remains the sole spatial BA lane; the two
    extra 256px crops add ID tokens only. Targets CL3's catastrophic tail
    (jisoo, kickboxing) rather than its already-competitive typical image.
