defaults:
  - one_id_ba_NN1d_frozen_ca
  - _self_

# Target attention is the exact zero-step anchor. Packed-ROI reference BA is a
# zero-initialized per-head residual weighted by query-wise attention confidence.
model:
  ba_sa_ref_token_mode: roi
  ba_sa_face_mode: confidence_residual
  ba_sa_ref_layer_scope: all
  ba_sa_roi_grid_size: 8
