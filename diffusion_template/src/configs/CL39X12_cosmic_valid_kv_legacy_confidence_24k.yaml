defaults: [CL39X01_cosmic_valid_key_attention_24k, _self_]

model:
  cl39x_settings:
    ba_valid_kv_confidence_source: legacy_masked_full

trainer:
  preserve_training_model_during_validation: true

writer:
  loss_names: [loss, loss_ba_aux, loss_ba_frequency_surface,
    ba/valid_kv/valid_fraction/all, ba/valid_kv/valid_count/all,
    ba/valid_kv/all_invalid_fraction/all, ba/valid_kv/entropy_valid/all,
    ba/valid_kv/entropy_legacy/all,
    ba/valid_kv/entropy_legacy_minus_valid/all,
    ba/valid_kv/confidence_legacy/all,
    ba/valid_kv/confidence_valid/all,
    ba/valid_kv/confidence_legacy_minus_valid/all,
    ba/null_key/reference_fraction/all]
  experiment_comment: >-
    CL39-X12 uses X01 valid-only reference K/V for message content while
    retaining CL39 masked-full entropy confidence and its original correction
    budget. No trainables, losses, data, or validation inputs change.
