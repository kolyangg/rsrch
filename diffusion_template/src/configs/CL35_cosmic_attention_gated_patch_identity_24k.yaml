defaults:
  - CL31_cosmic_attention_ownership_alignment_24k
  - _self_

model:
  ba_patch_identity_enabled: true
  ba_patch_identity_backend: dinov2_vits14
  ba_patch_identity_cadence: 16
  ba_patch_identity_max_timestep: 200
  ba_patch_identity_weight: 0.01
  ba_patch_identity_ramp_start_step: 2000
  ba_patch_identity_ramp_end_step: 6000
  ba_patch_identity_min_gate_mass: 0.55
  ba_patch_identity_max_samples_per_step: 1

datasets:
  train:
    cosmic_large_adapted:
      num_identity_refs: 3

writer:
  loss_names: [loss, loss_ba_aux, loss_ba_attention_ownership, loss_ba_patch_identity, ba/patch_identity_similarity, ba/patch_identity_gate_mass, ba/patch_identity_applied_fraction]
  experiment_comment: CL35 vs CL31 adds only a sparse attention-gated DINOv2 patch-maxcos identity reward.
