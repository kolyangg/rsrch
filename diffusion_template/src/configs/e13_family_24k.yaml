defaults:
  - one_id_09Feb_testing
  - override metrics: all_metrics
  - override lr_scheduler: warmup_hold_cosine_24k
  - _self_

# 10 Aug 2026 - E13C-CFG-01: This is the single shared architecture/runtime
# contract for E13, BC_E13 and CL14. Leaf recipes may select only a dataset and
# CL14's training-only mask feather; all output-affecting inference values live
# here so cross-dataset comparisons cannot drift.
train_on_separate_image: true
train_ba_all_steps: true
train_ba_only: true
branched_attn_weight_mode: noise_and_ref
branched_attn_new_weight_kind: lora
train_branched_ca_lora: false
disable_branched_sa: false
disable_branched_ca: true
ba_patch_top_k: 1.0
ba_train_top_k: 1.0
non_ba_train: false
strict_face_routing: false

loss_kind: masked_alternating
lambda_face: 0.1
lr_for_lora: 1.0e-4
ba_lr: 1.0e-4
generic_adapter_lr: 1.0e-4
photomaker_default_lr: 1.0e-4

model:
  rank: 32
  weight_dtype: bf16
  e13_family_contract: true
  ba_hard_v1_lora_rank: 128
  generic_adapter_train_scope: effective_all
  photomaker_default_train_scope: effective_all
  strict_branched_install: true
  strict_trainable_contract: true
  branched_state_dict_mode: trainable_unet_v2
  ba_training_mask_feather: 0
  conditioning_cache_enabled: false
  skip_unused_text_conditioning: true
  batched_conditioning_preparation: true
  cache_prepared_masks: true
  compute_branch_debug_outputs: false
  train_branched_ca_lora: false
  branched_attn_weight_mode: noise_and_ref
  branched_attn_new_weight_kind: lora

pipeline:
  variant: null
  pose_adapt_ratio: 0.0
  ca_mixing_for_face: false
  photomaker_start_step: 10
  merge_start_step: 10
  branched_attn_start_step: 15

trainer:
  epoch_len: 2000
  n_epochs: 12
  masked_loss_step: 1
  save_period: 1
  post_backward_parameter_touch: false
  grad_norm_log_only: true
  face_quality:
    enabled: true
    expected_images: 96
    device: cuda
    execution_mode: deferred

weights_only_save_period: 1
validation_shadow_photomaker_default: true
validation_processor_base_mode: legacy_full_copy
strict_validation_processor_copy: true
update_proc_weights_val: true
pretrained_model_for_validation_name_or_path: SG161222/RealVisXL_V4.0

dataloaders:
  train:
    batch_size: 2
    num_workers: 2
    pin_memory: false
  manual_val:
    batch_size: 12
    num_workers: 1
    pin_memory: false

val_datasets_names: [manual_val]
datasets:
  val:
    manual_val:
      limit: 96

validation_args:
  num_images_per_prompt: 1
  num_inference_steps: 50
  guidance_scale: 5
  photomaker_start_step: 10
  merge_start_step: 10
  branched_attn_start_step: 15

automatic_bboxes: true
automatic_bboxes_every_val: false
force_log_first_auto_bbox: false
val_debug: false

expected_trainable_contract:
  enabled: true
  total_tensors: 2240
  total_parameters: 219217920
  optimizer_tensors: 2240
  optimizer_parameters: 219217920
  categories:
    branched_sa_r128:
      name_substring: ".attn1.processor."
      tensors: 840
      parameters: 127795200
    generic_effective_adapter_r32:
      name_substring: ".lora_adapter."
      tensors: 700
      parameters: 30474240
    photomaker_default_effective_adapter_r64:
      name_substring: ".default."
      tensors: 700
      parameters: 60948480
