defaults:
  - trainer: photomaker_lora
  - model: photomaker_branched_lora2
  - writer: cometml
  - transforms: only_instance
  - ddp: accelerate
  - lr_scheduler: warmup_hold_cosine_24k
  - pipeline: pm_br_09Feb_testing
  - metrics: all_metrics
  - datasets: all_datasets
  - dataloaders: all_dataloaders
  - _self_

# Shared architecture and runtime contract for the ten supported 24k recipes.
train_on_separate_image: true

lr_for_lora: 1.0e-4
ba_lr: 1.0e-4
generic_adapter_lr: 1.0e-4
photomaker_default_lr: 1.0e-4

model:
  rank: 32
  weight_dtype: bf16
  e13_settings:
    ba_training_mask_feather: 0

pipeline:
  variant: null
  pose_adapt_ratio: 0.0
  ca_mixing_for_face: false
  photomaker_start_step: 10
  merge_start_step: 10
  branched_attn_start_step: 15

trainer:
  epoch_len: 2000
  n_epochs: 12
  masked_loss_step: 1
  save_period: 1
  post_backward_parameter_touch: false
  grad_norm_log_only: true
  face_quality:
    enabled: true
    expected_images: 96
    device: cuda
    execution_mode: deferred

weights_only_save_period: 1
pretrained_model_for_validation_name_or_path: SG161222/RealVisXL_V4.0

dataloaders:
  train:
    batch_size: 2
    num_workers: 2
    pin_memory: false
  manual_val:
    batch_size: 12
    num_workers: 1
    pin_memory: false

train_dataset_name: large_dataset
val_datasets_names: [manual_val]
datasets:
  val:
    manual_val:
      limit: 96

mask_expansion_ratio: 1.0
mask_softness: 0.0
val_debug: false
validation_debug_timing: false
validation_args:
  negative_prompt: "lowres, text, error, cropped, worst quality, low quality, jpeg artifacts, signature, watermark, blurry"
  debug_dir: hm_debug
  val_debug: ${val_debug}
  num_images_per_prompt: 1
  num_inference_steps: 50
  guidance_scale: 5
  height: 1024
  width: 1024
  target_size: [1024, 1024]
  original_size: [1024, 1024]
  crops_coords_top_left: [0, 0]
  use_branched_attention: true
  face_embed_strategy: ${pipeline.face_embed_strategy}
  photomaker_start_step: 10
  photomaker_use_lora_adapter: false
  merge_start_step: 10
  branched_attn_start_step: 15
  mask_expansion_ratio: ${mask_expansion_ratio}
  mask_softness: ${mask_softness}
  branched_start_mode: ${pipeline.branched_start_mode}

ddp_timeout_seconds: 21600

optimizer:
  _convert_: partial
  _target_: torch.optim.AdamW
  weight_decay: 0

loss_function:
  _target_: src.loss.diffusion_loss.MaskedDiffusionLoss

inference_metrics: [clip_ts, id_sim_best]
