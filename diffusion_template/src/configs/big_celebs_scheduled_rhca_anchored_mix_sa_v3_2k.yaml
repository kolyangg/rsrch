defaults:
  - big_celebs_scheduled_rhca_residual_sa_v2_40k
  - _self_

# E3: architecture-only 2k causal gate. It keeps the residual-v2 dataset
# schedule, rank, 46 sites, optimizer precision, timestep policy, PhotoMaker
# conditioning, fixed-96 panel, and detached wrong-reference diagnostic.
model:
  ba_architecture_version: anchored_mix_sa_v3
  ba_mix_init: 0.50
  ba_mix_floor: 0.25
  ba_mix_max: 0.90
  ba_mix_timestep: true
  ba_mix_face_area: true
  ba_reference_rms_match: true
  ba_reference_rms_clip_min: 0.50
  ba_reference_rms_clip_max: 2.00
  ba_mix_override: null
  ba_telemetry_enabled: true
  ba_telemetry_interval: 50
  ba_reference_loss_mode: detached_diagnostic

# The v3 mix replaces the v2 gate role but keeps the same controlled LR.
ba_mix_lr: 2.0e-4

loss_function:
  reference_mode: detached_diagnostic
  reference_weight: 0.0
  reference_margin: 0.0
  reference_relative_margin: 0.0

writer:
  loss_names:
    - loss
    - loss_full
    - loss_face
    - loss_boundary
    - loss_reference_causal
    - reference_error_gap
    - reference_error_relative_gap
    - loss_wrong_reference_face
    - reference_prediction_delta_ratio
    - reference_shuffle_applied
    - ba/mix_mean/all
    - ba/mix_min/all
    - ba/mix_max/all
    - ba/reference_native_rms_ratio/all
    - ba/contribution_native_rms_ratio/all
    - ba/reference_native_cosine/all
    - ba/merged_native_rms_ratio/all
    - ba/reference_valid_key_fraction/all
    - ba/denoise_progress_mean/all
    - ba/mix_mean/mid
    - ba/reference_native_rms_ratio/mid
    - ba/contribution_native_rms_ratio/mid
    - ba/reference_native_cosine/mid
    - ba/merged_native_rms_ratio/mid
    - ba/mix_mean/up0
    - ba/reference_native_rms_ratio/up0
    - ba/contribution_native_rms_ratio/up0
    - ba/reference_native_cosine/up0
    - ba/merged_native_rms_ratio/up0
    - ba/mix_mean/up1
    - ba/reference_native_rms_ratio/up1
    - ba/contribution_native_rms_ratio/up1
    - ba/reference_native_cosine/up1
    - ba/merged_native_rms_ratio/up1

trainer:
  epoch_len: 2000
  n_epochs: 1
  validation_interval_steps: 2000

pipeline:
  pose_adapt_ratio: 0.0
  ca_mixing_for_face: false
