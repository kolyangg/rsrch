defaults:
  - CL39_cosmic_null_key_confidence_router_24k
  - override writer: console
  - _self_

# Evaluation-only R-on-face intervention. The ordinary batch-12 fixed-96
# trainer validation path is retained; only the CL39 attention merge changes.
validation_only: true
validation_epoch: 12
val_datasets_names: [manual_val]
inference_metrics: []

trainer:
  from_pretrained: ${oc.env:CL39_CHECKPOINT}
  save_dir: ${oc.env:CL39_AUDIT_SAVE_DIR}
  face_quality:
    enabled: false
  log_per_image_id_sim_table: false

writer:
  run_name: CL39_attention_audit_serv_reference_face

validation_args:
  cl39_analysis_enabled: true
  cl39_analysis_capture: false
  cl39_analysis_branch_mode: reference_face

validation_debug_timing: true
