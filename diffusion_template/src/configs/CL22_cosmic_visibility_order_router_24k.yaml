defaults:
  - CL19_cosmic_true_soft_fullquery_router_24k
  - _self_

# CL22 specializes up0/up1; every other self-attention processor remains CL19.
model:
  ba_hardcase_mode: visibility_order
  ba_hardcase_groups: [up_blocks.0, up_blocks.1]
  ba_hardcase_fallback_mode: soft_router
  ba_hardcase_ownership_hidden_dim: 128
  ba_hardcase_top_native_floor: 0.95
  ba_hardcase_visible_face_floor: 0.50
  ba_semantic_ownership_loss_weight: 0.05

datasets:
  train:
    cosmic_large_adapted:
      semantic_occlusion_probability: 0.25
      semantic_occlusion_seed: 150017

expected_trainable_contract:
  enabled: true
  total_tensors: 2384
  total_parameters: 224652396
  optimizer_tensors: 2384
  optimizer_parameters: 224652396
  categories:
    branched_sa_r128: {name_substring: ".attn1.processor.", tensors: 984, parameters: 133229676}
    generic_effective_adapter_r32: {name_substring: ".lora_adapter.", tensors: 700, parameters: 30474240}
    photomaker_default_effective_adapter_r64: {name_substring: ".default.", tensors: 700, parameters: 60948480}

writer:
  loss_names:
    - loss
    - loss_ba_aux
    - loss_ba_ownership
    - ba/visibility_order_router_delta_rms/up0
    - ba/visibility_order_router_delta_rms/up1
    - ba/visibility_order_routed_native_ratio/up0
    - ba/visibility_order_routed_native_ratio/up1
    - ba/visibility_order_top_probability/up0
    - ba/visibility_order_top_probability/up1
  experiment_comment: CL22 replaces only CL19 up0/up1 blends with direct three-state top/visible/background ownership.
