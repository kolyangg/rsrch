train:
    dreambooth:
        _target_: src.datasets.dreambooth.DreamBoothTrainDataset
        data_path: /home/jovyan/bobkov/dreambooth/dataset/dog
        placeholder_token: sks
        class_name: dog
        instance_transforms: ${transforms.instance_transforms.train}
      
    # cosmic:
    #     _target_: src.datasets.cosmic.CosmicDoubledTrain
    #     cosmic_json_pth: /home/jovyan/bobkov/persongen/cosmic_gathered.json
    #     cosmic_texts_json_pth: /home/jovyan/bobkov/all_texts_cosmic_by_qween3.json 
    #     cosmic_large_json_pth: /home/jovyan/bobkov/cosmic_large_alldata.json
    #     cosmic_large_texts_json_pth: /home/jovyan/bobkov/all_texts_cosmic_large_by_qween3_trigger_word.json
    #     images_path: /home/jovyan/bobkov/cosmic_data
    #     num_refs: 1
    #     instance_transforms: ${transforms.instance_transforms.train}

    cosmic:
        _target_: src.datasets.cosmic.CosmicDoubledTrain
        cosmic_json_pth: ../dataset_full/cosmic_gathered.json
        cosmic_texts_json_pth: ../dataset_full/all_texts_cosmic_by_qween3.json 
        cosmic_large_json_pth: ../dataset_full/cosmic_large_alldata.json
        cosmic_large_texts_json_pth: ../dataset_full/all_texts_cosmic_large_by_qween3_trigger_word.json
        images_path: /home/aalanov/Bobkov_Denis/datasets/CosmicManHQ-1.0/
        num_refs: 1
        train_on_separate_image: ${train_on_separate_image}
        same_id_ref_map_json_pth: null
        instance_transforms: ${transforms.instance_transforms.train}

    one_id:
        _target_: src.datasets.cosmic.OneIDTrain
        cosmic_json_pth: ../dataset_full/one_id/nm0005092_adj_train.json
        images_path: ../dataset_full/one_id/nm0005092_adj
        num_refs: 1
        train_on_separate_image: ${train_on_separate_image}
        instance_transforms: ${transforms.instance_transforms.train}

    one_id_holdout51:
        _target_: src.datasets.one_id_holdout.OneIDHoldoutTrain
        cosmic_json_pth: ../dataset_full/one_id/nm0005092_adj_train.json
        images_path: ../dataset_full/one_id/nm0005092_adj
        num_refs: 1
        train_on_separate_image: ${train_on_separate_image}
        excluded_filenames: [51.jpg]
        instance_transforms: ${transforms.instance_transforms.train}

    cosmic_large_one_id:
        _target_: src.datasets.cosmic_large_one_id.CosmicLargeOneID
        data_json_path: ../dataset_full/cosmic_large_one_id/train.json
        images_path: ../dataset_full/cosmic_large_one_id
        num_refs: 1
        random_horizontal_flip: true
        # Avoid exhausting and recreating a 12-worker DataLoader every step
        # when this intentionally contains only one real target.
        virtual_length: 1000
        instance_transforms: ${transforms.instance_transforms.train}

    # Isolated full-Cosmic path. The historical `cosmic` entry above remains
    # unchanged for exact replay and does not consume the face_paths manifest.
    cosmic_large_adapted:
        _target_: src.datasets.cosmic_large_adapted.CosmicLargeAdaptedTrain
        manifest_path: ${oc.env:COSMIC_LARGE_MANIFEST}
        dataset_root: ${oc.env:COSMIC_LARGE_ROOT}
        num_refs: 1
        min_face_res: 192
        min_reference_score: null
        reference_crop_margin: 0.2
        reference_content_size: 256
        reference_canvas_size: null
        reference_canvas_fill: 127
        random_horizontal_flip: true
        random_reference_flip: true
        prompt_mode: legacy
        prompt_max_words: null
        instance_transforms: ${transforms.instance_transforms.train}

    controlled_identity_factorial:
        _target_: src.datasets.controlled_identity_factorial.ControlledIdentityFactorial
        manifest_path: ${oc.env:CONTROLLED_FACTORIAL_ROOT,../dataset_full/controlled_identity_factorial/nm0004960_v1}/manifest.json
        artifact_root: ${oc.env:CONTROLLED_FACTORIAL_ROOT,../dataset_full/controlled_identity_factorial/nm0004960_v1}
        target_mode: multi
        reference_mode: full_scene
        virtual_length: 1000
        random_horizontal_flip: true
        verify_hashes: true
        require_sealed_validation: true
        reference_crop_margin: null
        reference_content_size: null
        reference_canvas_size: null
        reference_canvas_fill: 127
        instance_transforms: ${transforms.instance_transforms.train}
        

val:
    db_liv_small:
      _target_: src.datasets.dreambooth.DreamBoothLivingSmall
      data_path: /home/jovyan/bobkov/dreambooth/dataset/dog
      placeholder_token: sks
      class_name: dog

    # man:
    #   _target_: src.datasets.man_datasets.ManValDataset
    #   data_json_pth: /home/jovyan/bobkov/persongen/filtered_ids3.json
    #   images_path: /home/jovyan/bobkov/full_dataset
    
    man_face:
      _target_: src.datasets.man_datasets.ManValFaceDataset
      data_json_pth: /home/jovyan/bobkov/persongen/filtered_ids3.json
      images_path: /home/jovyan/bobkov/full_dataset

    man:
      _target_: src.datasets.cosmic.CosmicDoubledTrain
      cosmic_json_pth: ../dataset_full/cosmic_gathered.json
      cosmic_texts_json_pth: ../dataset_full/all_texts_cosmic_by_qween3.json
      cosmic_large_json_pth: ../dataset_full/cosmic_large_alldata.json
      cosmic_large_texts_json_pth: ../dataset_full/all_texts_cosmic_large_by_qween3_trigger_word.json
      images_path: /home/aalanov/Bobkov_Denis/datasets/CosmicManHQ-1.0/
      num_refs: 1
      instance_transforms: ${transforms.instance_transforms.train}
      limit: 3

    manual_val:
      _target_: src.datasets.manual_val.ManualPhotoMakerValDataset
      images_dir: ../dataset_full/val_dataset/references
      prompts_path: ../dataset_full/val_dataset/prompts_10.txt
      classes_json_path: ../dataset_full/val_dataset/classes_ref.json
      bbox_mask_ref: ../dataset_full/val_dataset/ref_bboxes.json
      # bbox_mask_gen: ../dataset_full/val_dataset/pm96_bboxes.json
      bbox_mask_gen: ../dataset_full/val_dataset/pm96_bboxes_new.json
      seeds: [0] # [0, 1, 2]
      limit: 96 # 20
      # limit: 4 # temp

    one_id_val:
      _target_: src.datasets.manual_val.ManualPhotoMakerValDataset
      images_dir: ../dataset_full/one_id/ref
      prompts_path: ../dataset_full/val_dataset/prompts_10.txt
      classes_json_path: ../dataset_full/one_id/one_id_classes_ref.json
      bbox_mask_ref: ../dataset_full/one_id/nm0005092_adj_test.json
      bbox_mask_gen: ../dataset_full/one_id/one_id_ref_bboxes.json
      seeds: [0]
      # limit: 96 # 10 # 1
      limit: 12 # 10 # 1

    cosmic_large_one_id_val:
      _target_: src.datasets.manual_val.ManualPhotoMakerValDataset
      images_dir: ../dataset_full/cosmic_large_one_id/validation_refs
      prompts_path: ../dataset_full/cosmic_large_one_id/validation_prompts.txt
      classes_json_path: ../dataset_full/cosmic_large_one_id/classes_ref.json
      bbox_mask_ref: ../dataset_full/cosmic_large_one_id/reference_bboxes.json
      bbox_mask_gen: ../dataset_full/cosmic_large_one_id/photomaker_generated_bboxes.json
      seeds: [0]
      limit: 12

    controlled_identity_factorial_val:
      _target_: src.datasets.manual_val.ManualPhotoMakerValDataset
      images_dir: ${oc.env:CONTROLLED_FACTORIAL_ROOT,../dataset_full/controlled_identity_factorial/nm0004960_v1}/validation_refs
      prompts_path: ${oc.env:CONTROLLED_FACTORIAL_ROOT,../dataset_full/controlled_identity_factorial/nm0004960_v1}/validation_prompts.txt
      classes_json_path: ${oc.env:CONTROLLED_FACTORIAL_ROOT,../dataset_full/controlled_identity_factorial/nm0004960_v1}/classes_ref.json
      bbox_mask_ref: ${oc.env:CONTROLLED_FACTORIAL_ROOT,../dataset_full/controlled_identity_factorial/nm0004960_v1}/reference_bboxes.json
      bbox_mask_gen: ${oc.env:CONTROLLED_FACTORIAL_ROOT,../dataset_full/controlled_identity_factorial/nm0004960_v1}/photomaker_generated_bboxes.json
      seeds: [0]
      limit: 12
  
