defaults:
  - CL14_cosmic_joint_shadow_sa128_softmask_24k
  - override metrics: all_metrics_subject_v2
  - _self_

# 12 Aug 2026 - Corrected-r2 validation binds identity metrics and PhotoMaker
# conditioning to the declared reference-face box; model deltas stay in leaves.
pipeline:
  _target_: src.pipelines.photomaker_branched_subject_v2.PhotomakerBranchedSubjectV2Pipeline.from_pretrained

validation_args:
  face_subject_selection_policy: bbox_overlap_v2

inference_metrics: [clip_ts, id_sim_best_legacy, id_sim_subject_v2]

writer:
  loss_names: [loss, loss_ba_aux, loss_ba_crossview]
