defaults:
  - CL15_CL20_hardcase_base_24k
  - _self_

# CL20 changes only the deterministic dataset schedule. Model/optimizer are CL14.
train_dataset_name: cl20_hardcase_curriculum
train_dataloader_shuffle: false

writer:
  experiment_comment: >-
    CL20 keeps the CL14 model exact: 80/20 Cosmic/curated depth>=6 BigCelebs
    through 20k, then 4k Cosmic-only re-anchoring. BigCelebs is balanced across
    synthetic-small, occlusion-caption and action-caption strata.

