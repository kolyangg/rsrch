_target_: src.model.photomaker_branched.lora2.PhotomakerBranchedLora ### Modified to make attn_processor trainable in branched version ###
pretrained_model_name_or_path: stabilityai/stable-diffusion-xl-base-1.0
# pretrained_model_name_or_path: SG161222/RealVisXL_V4.0
photomaker_path: ${oc.env:HOME}/.cache/huggingface/hub/models--TencentARC--PhotoMaker-V2/snapshots/f5a1e5155dc02166253fa7e29d13519f5ba22eac/photomaker-v2.bin
weight_dtype: bf32
target_size: 1024
rank: 16
photomaker_lora_rank: 64
lora_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
init_lora_weights: gaussian
trigger_word: img
pose_adapt_ratio: ${pipeline.pose_adapt_ratio}
ca_mixing_for_face: ${pipeline.ca_mixing_for_face}
face_embed_strategy: ${pipeline.face_embed_strategy}
train_branch_mode: ${pipeline.train_branch_mode}
photomaker_start_step: 10
merge_start_step: 10
branched_attn_start_step: 15
num_inference_steps: 50
# Defaults preserve the N3a/NN1 spatial BA route. NN2 configs override only
# these switches, so setting them back restores the legacy architecture.
ba_sa_ref_token_mode: full_grid
ba_sa_face_mode: reference
ba_sa_ref_layer_scope: all
ba_sa_roi_grid_size: 8
ba_sa_core_ratio: 0.7
ba_sa_mix_init: 0.25
# New processor variants are opt-in; these defaults preserve all legacy runs.
ba_processor_variant: legacy
ba_site_policy: all
ba_connector_rank: 16
# NN2 parity: reference_minus_target. NN3 opts into reference_minus_null.
ba_connector_input_mode: reference_minus_target
ba_null_memory_tokens: 8
# NN4 correctness/causality controls. Defaults reproduce NN1-NN3 behavior.
ba_cfg_reference_noise_pairing: false
ba_reference_token_text_mode: original
ba_reference_pooled_text_mode: target
ba_null_residual_loss_weight: 0.0
ba_match_null_margin_weight: 0.0
ba_match_null_margin: 0.02
ba_cap_loss_weight: 0.0
ba_cap_loss_target: 0.20
ba_gate_max: 0.5
ba_gate_init_logit: 0.0
ba_delta_rms_cap: 0.25
ba_target_core_erode_frac: 0.10
ba_reference_token_mode: legacy_zero_mask
ba_reference_continuation: legacy_ref_projection
ba_output_anchor_mode: none
ba_diagnostics: false
