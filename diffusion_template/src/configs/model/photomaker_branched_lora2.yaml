_target_: src.model.photomaker_branched.clean_full_model.PhotomakerBranchedLora
pretrained_model_name_or_path: stabilityai/stable-diffusion-xl-base-1.0
# pretrained_model_name_or_path: SG161222/RealVisXL_V4.0
photomaker_path: ${oc.env:HOME}/.cache/huggingface/hub/models--TencentARC--PhotoMaker-V2/snapshots/f5a1e5155dc02166253fa7e29d13519f5ba22eac/photomaker-v2.bin
weight_dtype: bf32
target_size: 1024
rank: 16
photomaker_lora_rank: 64
lora_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
init_lora_weights: gaussian
trigger_word: img
pose_adapt_ratio: ${pipeline.pose_adapt_ratio}
ca_mixing_for_face: ${pipeline.ca_mixing_for_face}
face_embed_strategy: ${pipeline.face_embed_strategy}
train_branch_mode: ${pipeline.train_branch_mode}
photomaker_start_step: 10
merge_start_step: 10
branched_attn_start_step: 15
num_inference_steps: 50

# One closed-schema input replaces the former 226 flat constructor arguments.
# Only the last four sections vary across allowlisted run families.
clean_full_config:
  runtime:
    skip_unused_text_conditioning: true
    conditioning_cache_enabled: false
    conditioning_cache_max_entries: 512
    batched_conditioning_preparation: true
    face_subject_selection_policy: legacy_first
    cache_prepared_masks: true
    compute_branch_debug_outputs: false
  contract:
    strict_branched_install: true
    strict_trainable_contract: true
    state_dict_mode: trainable_v2
    generic_adapter_train_scope: effective_all
    photomaker_default_train_scope: effective_all
    hard_v1_lora_rank: 128
  architecture:
    version: hard_replace_v1
    trainable_dtype: inherit
    training_timestep_policy: uniform_all
    self_attention_groups: null
    enforce_reference_only_hard_route: true
    true_reference_key_mask: false
    branch_output_rank: null
    reference_roi_warp: false
  training_mask_feather: 0
  hardcase:
    mode: "off"
    groups: null
    telemetry_enabled: true
  frequency_surface:
    enabled: false
    groups: null
  recent_extension:
    kind: none
    groups: null
