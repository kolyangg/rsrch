defaults:
  - one_id_ba_staged_legacy_N25
  - _self_

# N28: PhotoMaker target path plus a hard-bbox CA residual from compact ID tokens.
branched_attn_weight_mode: shared
branched_attn_new_weight_kind: lora
train_branched_ca_lora: true

pipeline:
  pose_adapt_ratio: 0
  ca_mixing_for_face: false
  face_embed_strategy: id_embeds

model:
  ba_sa_mode: standard
  ba_ca_mode: target_face_residual
  ba_ca_train_mode: target_face
  ba_identity_token_count: 4
  ba_pm_preservation_mode: hard_epsilon_merge
  ba_hard_mask_resize: area_preserving
  disable_reference_spatial_branch: true
  ba_skip_inactive_optimizer_decay: true
  ba_fix_tensor_ref_resolution: true
  use_id_embeds: false
  id_loss_identity_source: reference
