defaults:
  - E15_large_ds_joint_persist_sa128_protected_24k
  - _self_

train_dataset_name: large_dataset_balanced_multiref
train_dataloader_shuffle: false

model:
  batched_conditioning_preparation: false
  conditioning_cache_enabled: false
  cache_prepared_masks: false

datasets:
  train:
    large_dataset_balanced_multiref:
      schedule_rows: 48000
      # 05 Aug 2026 - Decode env text so the sealed schedule offset stays integer-typed.
      schedule_start_row: ${oc.decode:${oc.env:LARGE_DATASET_SCHEDULE_START_ROW,0}}
      schedule_seed: 130018
      num_identity_refs: 3

writer:
  experiment_comment: >-
    E18 vs E15 changes only training sampling/conditioning: a deterministic
    48,000-row identity-balanced schedule, one distinct quality/pose-diverse
    spatial reference for BA, and up to three additional distinct same-ID
    quality-ranked PhotoMaker references. The first reference remains the sole
    spatial latent/KV lane; all references contribute PhotoMaker ID tokens.
