defaults:
  - CL19_cosmic_true_soft_fullquery_router_24k
  - _self_

model:
  ba_pm_boundary_distill_enabled: true
  ba_pm_boundary_distill_probability: 0.25
  ba_pm_boundary_distill_weight: 0.05
  ba_pm_boundary_distill_top_weight: 0.02
  ba_pm_boundary_distill_width: 2

datasets:
  train:
    cosmic_large_adapted:
      semantic_occlusion_probability: 0.25
      semantic_occlusion_seed: 150017

writer:
  loss_names:
    - loss
    - loss_ba_aux
    - loss_ba_pm_boundary
    - loss_ba_pm_top_object
    - ba/pm_boundary_fraction
    - ba/pm_boundary_teacher_student_rms
  experiment_comment: CL24 adds sparse training-only native-PhotoMaker distillation on synthetic top-object/contact-boundary pixels; inference stays CL19.
