    ba_valid_kv_enabled: true
    ba_valid_kv_groups: [up_blocks.0, up_blocks.1]
    ba_valid_kv_threshold: 0.5
    ba_valid_kv_entropy_chunk_size: 256
writer:
  loss_names: [loss, loss_ba_aux, loss_ba_frequency_surface,
