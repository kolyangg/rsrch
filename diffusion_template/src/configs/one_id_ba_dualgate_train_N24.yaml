defaults:
  - one_id_09Feb_testing
  - _self_

# N24: replace fixed PAR/CAMIX with separate ref/noise face attentions and a learned per-head gate.
loss_kind: blended_masked
lambda_face: 0.15
# Match inference: text-only at high noise, PhotoMaker next, then gated BA refinement.
train_ba_all_steps: false
train_branched_ca_lora: false
branched_attn_weight_mode: noise_and_ref
branched_attn_new_weight_kind: lora
ba_noise_lr_scale: 0.1

pipeline:
  ba_enable_runtime_sa_knobs: false
  pose_adapt_ratio: 0
  ca_mixing_for_face: false
  ba_face_fusion_mode: dual_attention_gate
  ba_face_fusion_gate_init: 0.2
  ba_face_fusion_gate_max: 0.5

model:
  ba_enable_runtime_sa_knobs: false
  ba_face_fusion_mode: ${pipeline.ba_face_fusion_mode}
  ba_face_fusion_gate_init: ${pipeline.ba_face_fusion_gate_init}
  ba_face_fusion_gate_max: ${pipeline.ba_face_fusion_gate_max}
  use_id_embeds: false
  use_id_loss: true
  id_loss_weight: 0.1
  id_loss_max_timestep: 500
