defaults:
  - CL3_cosmic_joint_shadow_sa128_fmtfix_24k
  - _self_

# CL7 = CL3 + E24's exact alternating loss.
#
# Same diagnosis as CL6, blunter instrument: odd batches use full-latent MSE,
# supervising the whole image including the head/shoulder junction, while even
# batches stay face-only. CL6 asks whether a narrow weighted ring suffices;
# CL7 asks whether the junction needs equal supervision.
loss_kind: masked_alternating_audited

trainer:
  masked_loss_step: 2

writer:
  loss_names:
    - loss
    - loss_face
    - loss_full
    - loss_mode_face
    - active_grad_norm_ba
    - active_grad_norm_generic_adapter
    - active_grad_norm_photomaker_default
  experiment_comment: >-
    CL7 vs CL3 alternates face-only and full-latent MSE on exact even/odd
    optimizer batches, restoring whole-image supervision of the face/body
    junction. Primary metric is face/body alignment; id_sim is secondary.
