defaults:
  - cosmic_large_one_id_rhca_apr2026_replay
  - _self_

# Separate manifest-backed family: the historical replay remains selectable
# unchanged, while these three arms share one immutable identity/split.
controlled_factorial:
  artifact_root: ${oc.env:CONTROLLED_FACTORIAL_ROOT,../dataset_full/controlled_identity_factorial/nm0004960_v1}
  manifest_path: ${controlled_factorial.artifact_root}/manifest.json
  target_mode: multi
  reference_mode: full_scene

train_dataset_name: controlled_identity_factorial
val_datasets_names: [controlled_identity_factorial_val]

dataloaders:
  controlled_identity_factorial_val:
    batch_size: 12
    num_workers: 1

datasets:
  train:
    controlled_identity_factorial:
      manifest_path: ${controlled_factorial.manifest_path}
      artifact_root: ${controlled_factorial.artifact_root}
      target_mode: ${controlled_factorial.target_mode}
      reference_mode: ${controlled_factorial.reference_mode}
  val:
    controlled_identity_factorial_val:
      images_dir: ${controlled_factorial.artifact_root}/validation_refs
      prompts_path: ${controlled_factorial.artifact_root}/validation_prompts.txt
      classes_json_path: ${controlled_factorial.artifact_root}/classes_ref.json
      bbox_mask_ref: ${controlled_factorial.artifact_root}/reference_bboxes.json
      bbox_mask_gen: ${controlled_factorial.artifact_root}/photomaker_generated_bboxes.json
      limit: 12

# Task A architecture/loss contract. Factorial arms change only target_mode
# and reference_mode through the dedicated launcher.
disable_branched_ca: true
train_branched_ca_lora: false
branched_attn_weight_mode: noise_and_ref

model:
  train_branched_ca_lora: false
  branched_attn_weight_mode: noise_and_ref

continue_run: false
saved_checkpoint: null

trainer:
  resume_from: null
  masked_loss_step: 1
  n_epochs: 8

# Final factorial arms load the once-generated filename-keyed `_auto.json`
# companion, but never recompute it. The manifest seals both bbox maps.
automatic_bboxes: true
automatic_bboxes_every_val: false
force_log_first_auto_bbox: false
