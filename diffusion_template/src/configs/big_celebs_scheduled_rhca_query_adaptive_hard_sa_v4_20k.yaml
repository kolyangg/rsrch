defaults:
  - big_celebs_scheduled_rhca_residual_sa_v2_40k
  - _self_

# E6-H: clean reconstruction of the historical hard face route. Target-face
# self-attention is target-Q/reference-KV with no native/reference mixing.
model:
  ba_architecture_version: query_adaptive_hard_sa_v4
  ba_branch_q_rank: 16
  ba_ref_kv_rank: 32
  ba_output_rank: 32
  ba_face_fusion_mode: hard_reference_replace
  ba_face_branch_scale: 1.0
  ba_reference_rms_match: false
  ba_mix_override: null
  ba_telemetry_enabled: true
  ba_telemetry_interval: 50
  ba_reference_loss_mode: detached_diagnostic
  ba_spatial_reference_shuffle_probability: 0.25

ba_ref_query_lr: 5.0e-5
ba_ref_kv_lr: 5.0e-5
ba_ref_output_lr: 1.0e-4

loss_function:
  reference_mode: detached_diagnostic
  reference_weight: 0.0
  reference_margin: 0.0
  reference_relative_margin: 0.0

writer:
  loss_names:
    - loss
    - loss_full
    - loss_face
    - loss_boundary
    - loss_reference_causal
    - reference_error_gap
    - reference_error_relative_gap
    - loss_wrong_reference_face
    - reference_prediction_delta_ratio
    - reference_shuffle_applied
    - ba/reference_native_rms_ratio/all
    - ba/reference_native_cosine/all
    - ba/hard_face_native_leakage/all
    - ba/branch_query_delta_rms_ratio/all
    - ba/reference_valid_key_fraction/all
    - ba/denoise_progress_mean/all
    - ba/reference_native_rms_ratio/mid
    - ba/reference_native_cosine/mid
    - ba/branch_query_delta_rms_ratio/mid
    - ba/reference_native_rms_ratio/up0
    - ba/reference_native_cosine/up0
    - ba/branch_query_delta_rms_ratio/up0
    - ba/reference_native_rms_ratio/up1
    - ba/reference_native_cosine/up1
    - ba/branch_query_delta_rms_ratio/up1

trainer:
  epoch_len: 2000
  n_epochs: 10
  validation_interval_steps: 2000
  save_period: 1

weights_only_save_period: 1

pipeline:
  pose_adapt_ratio: 0.0
  ca_mixing_for_face: false
