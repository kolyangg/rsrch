defaults:
  - CL15_CL20_hardcase_base_24k
  - _self_

# CL15: CL14 global BA plus a zero-initialized fixed 32x32 ROI residual.
model:
  ba_hardcase_mode: highres_roi
  ba_hardcase_groups: [up_blocks.0, up_blocks.1]
  ba_hardcase_roi_size: 32
  # Cosmic's CL14 pool starts at 192 px; 256 keeps the local path trainable.
  ba_hardcase_face_threshold_px: 256
  ba_hardcase_gate_max: 0.25

expected_trainable_contract:
  enabled: false

writer:
  experiment_comment: >-
    CL15 vs CL14 adds a bounded shared-projection target-ROI-Q/reference-ROI-KV
    residual at up0/up1 for faces <=256px. The gate starts at exactly zero.

