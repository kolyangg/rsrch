defaults:
  - one_id_09Feb_testing
  - _self_

# N22: mechanism probe after the 9 Jul BA audit.
# Old behavior remains available by leaving ba_enable_runtime_sa_knobs=false.

loss_kind: masked_alternating
lambda_face: 0.1
train_ba_all_steps: false
train_branched_ca_lora: false
branched_attn_weight_mode: noise_and_ref
branched_attn_new_weight_kind: lora
ba_noise_lr_scale: 0.1
ba_ca_lr_scale: 0.1

pipeline:
  face_embed_strategy: id_embeds
  use_id_embeds: true
  ba_enable_runtime_sa_knobs: true
  pose_adapt_ratio: 0.25
  ca_mixing_for_face: true

model:
  face_embed_strategy: ${pipeline.face_embed_strategy}
  use_id_embeds: true
  ba_enable_runtime_sa_knobs: true
  ba_train_sa_id_embed_proj: true
  ba_ca_train_mode: ref_only
  use_id_loss: false
  id_loss_weight: 0.0

validation_args:
  face_embed_strategy: ${pipeline.face_embed_strategy}
