defaults:
  - CL23_cosmic_temporal_frequency_router_24k
  - _self_

# CL28 changes only three bounded schedule endpoints per CL23 SA processor.
model:
  ba_frequency_learnable_schedule_enabled: true
  ba_frequency_learnable_low_early: false
  ba_frequency_low_late_center: 0.85
  ba_frequency_low_late_half_range: 0.15
  ba_frequency_high_early_center: 0.75
  ba_frequency_high_early_half_range: 0.15
  ba_frequency_high_late_center: 1.25
  ba_frequency_high_late_half_range: 0.15
  ba_frequency_schedule_anchor_weight: 0.0001

expected_trainable_contract:
  enabled: true
  total_tensors: 2310
  total_parameters: 219218130
  optimizer_tensors: 2310
  optimizer_parameters: 219218130
  categories:
    branched_sa_r128: {name_substring: ".attn1.processor.", tensors: 910, parameters: 127795410}
    generic_effective_adapter_r32: {name_substring: ".lora_adapter.", tensors: 700, parameters: 30474240}
    photomaker_default_effective_adapter_r64: {name_substring: ".default.", tensors: 700, parameters: 60948480}

writer:
  loss_names:
    - loss
    - loss_ba_aux
    - loss_ba_frequency_schedule_anchor
    - ba/frequency_low_scale/down1
    - ba/frequency_low_scale/down2
    - ba/frequency_low_scale/mid
    - ba/frequency_low_scale/up0
    - ba/frequency_low_scale/up1
    - ba/frequency_high_scale/down1
    - ba/frequency_high_scale/down2
    - ba/frequency_high_scale/mid
    - ba/frequency_high_scale/up0
    - ba/frequency_high_scale/up1
    - ba/frequency_schedule_raw_abs_mean/all
    - ba/frequency_schedule_raw_abs_max/all
  experiment_comment: >-
    CL28 vs CL23 adds only zero-initialized, bounded per-processor corrections
    to low-late, high-early, and high-late frequency endpoints; step zero is
    exact CL23 and low-early remains fixed at 0.50.
