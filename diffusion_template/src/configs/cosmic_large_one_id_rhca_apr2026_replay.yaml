defaults:
  - one_id_rhca_apr2026_replay
  - _self_

# Keep the April RHCA model/training setup, changing only the one-identity
# training/validation dataset.
train_dataset_name: cosmic_large_one_id
val_datasets_names: [cosmic_large_one_id_val]

dataloaders:
  cosmic_large_one_id_val:
    batch_size: 12
    num_workers: 1

datasets:
  val:
    cosmic_large_one_id_val:
      limit: 12
