defaults:
  - big_celebs_scheduled_rhca_40k
  - _self_

# Correctness-only C0 arm. Attention math, rank, loss, optimizer, scheduler,
# dataset schedule, and fixed-96 inputs remain identical to the scheduled v1
# control. These switches change ownership/auditing and checkpoint fidelity.
model:
  strict_branched_install: true
  strict_trainable_contract: true
  branched_state_dict_mode: trainable_v2

# Preserve the historical alternate-base validation computation for the first
# clean BA32 comparison, but name and audit it explicitly. Override with
# validation_processor_base_mode=validation_native for the separately versioned
# native-base validation experiment.
validation_processor_base_mode: legacy_full_copy
strict_validation_processor_copy: true
update_proc_weights_val: true
