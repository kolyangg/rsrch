defaults:
  - large_dataset_joint_r128_24k
  - _self_

validation_shadow_photomaker_default: true
loss_kind: branched_reference

loss_function:
  _target_: src.loss.branched_reference_loss.BranchedReferenceLoss
  face_weight: 1.0
  full_weight: 0.1
  boundary_weight: 0.05
  boundary_ring_width: 2
  reference_weight: 0.0

writer:
  loss_names: [loss, loss_face, loss_full, loss_boundary]
  experiment_comment: >-
    E14 vs E13 adds protected reconstruction: face MSE plus 0.1 full-latent
    MSE and 0.05 two-cell boundary-ring MSE. Training still includes the
    PhotoMaker-default coadapter, while full-96 validation shadows it with the
    pretrained default.
