defaults:
  - CL19_cosmic_true_soft_fullquery_router_24k
  - _self_

# CL26 adds a bounded late ROI residual at up0/up1 over the exact CL19 router.
model:
  ba_hardcase_mode: anchored_roi
  ba_hardcase_groups: [up_blocks.0, up_blocks.1]
  ba_hardcase_fallback_mode: soft_router
  ba_hardcase_roi_size: 32
  ba_hardcase_face_threshold_px: 256
  ba_hardcase_gate_max: 0.25
  ba_hardcase_roi_gate_init: 0.10
  ba_hardcase_roi_gate_min: 0.05
  ba_hardcase_roi_progress_min: 0.60
  ba_hardcase_roi_rms_cap: 0.25

expected_trainable_contract:
  enabled: true
  total_tensors: 2276
  total_parameters: 219217956
  optimizer_tensors: 2276
  optimizer_parameters: 219217956
  categories:
    branched_sa_r128: {name_substring: ".attn1.processor.", tensors: 876, parameters: 127795236}
    generic_effective_adapter_r32: {name_substring: ".lora_adapter.", tensors: 700, parameters: 30474240}
    photomaker_default_effective_adapter_r64: {name_substring: ".default.", tensors: 700, parameters: 60948480}

writer:
  loss_names:
    - loss
    - ba/anchored_roi_eligible_fraction/up0
    - ba/anchored_roi_eligible_fraction/up1
    - ba/anchored_roi_gate/up0
    - ba/anchored_roi_gate/up1
    - ba/anchored_roi_delta_rms/up0
    - ba/anchored_roi_delta_rms/up1
    - ba/anchored_roi_residual_native_ratio/up0
    - ba/anchored_roi_residual_native_ratio/up1
  experiment_comment: CL26 adds a guaranteed-active late ROI32 target-Q/reference-KV residual at up0/up1 while retaining CL19 elsewhere.
