# Full-validation-set inference base config (cloned from inference/ba_n1_realvis.yaml).
# Used by serv_new_runs/run_full_validation.sh to score every saved run on the FULL 8-identity
# validation set (references/, 8 ids x 12 prompts = 96 images) instead of the 2-id training
# subsample (references_two, 24 images).
#
# Per-run overrides are passed on the infer.py command line (dotlist), e.g.:
#   python infer.py --config-name inference/full_val \
#       saved_checkpoint=saved/<run>/weights-epochN.pth output_dir=full_validation_results/<run> \
#       bbox_mask_gen_path=full_validation_results/_gen_bboxes_shared.json
# For the id_embeds run (N12) the script also appends:
#       pipeline.face_embed_strategy=id_embeds model.use_id_embeds=true \
#       validation_args.face_embed_strategy=id_embeds
#
# All our runs share branched_attn_weight_mode=noise_and_ref, ba_uncond_face_fix=true, id_only,
# and validate on RealVisXL_V4.0 — baked in below.

model:
  _target_: src.model.photomaker_branched.lora2.PhotomakerBranchedLora
  pretrained_model_name_or_path: SG161222/RealVisXL_V4.0
  photomaker_path: null   # resolution order: this value -> $PM_PATH -> HF cache glob
  weight_dtype: bf16      # infer.py overrides based on GPU support
  target_size: 1024
  rank: 32
  photomaker_lora_rank: 64
  lora_modules: [to_q, to_k, to_v, to_out.0]
  init_lora_weights: gaussian
  trigger_word: img
  pose_adapt_ratio: ${pipeline.pose_adapt_ratio}
  ca_mixing_for_face: ${pipeline.ca_mixing_for_face}
  ba_face_fusion_mode: ${pipeline.ba_face_fusion_mode}
  ba_face_fusion_gate_init: ${pipeline.ba_face_fusion_gate_init}
  ba_face_fusion_gate_max: ${pipeline.ba_face_fusion_gate_max}
  face_embed_strategy: ${pipeline.face_embed_strategy}
  train_branch_mode: ${pipeline.train_branch_mode}
  use_attn_v2: false
  use_id_embeds: false
  id_alpha: 0.3
  branched_attn_weight_mode: noise_and_ref
  branched_attn_new_weight_kind: lora
  train_branched_ca_lora: true
  train_ba_only: true
  ba_train_top_k: 1.0
  ba_patch_top_k: 1.0
  non_ba_train: false
  train_ba_all_steps: true
  photomaker_start_step: 10
  merge_start_step: 10
  branched_attn_start_step: 15
  num_inference_steps: 50
  ba_post_cfg_guidance_scale: true

pipeline:
  _target_: src.pipelines.photomaker_branched_clean.PhotomakerBranchedPipeline.from_pretrained
  pretrained_model_name_or_path: SG161222/RealVisXL_V4.0
  torch_dtype: bfloat16
  use_safetensors: true
  variant: null
  photomaker_start_step: 10
  merge_start_step: 10
  branched_attn_start_step: 15
  branched_start_mode: both
  train_branch_mode: both
  pose_adapt_ratio: 0
  ca_mixing_for_face: false
  ba_face_fusion_mode: legacy
  ba_face_fusion_gate_init: 0.25
  ba_face_fusion_gate_max: 1.0
  face_embed_strategy: id
  use_id_embeds: false
  id_alpha: 0.3
  photomaker_use_lora_adapter: false
  auto_mask_ref: false
  use_dynamic_mask: false
  use_bbox_mask_ref: true
  use_bbox_mask_gen: true

validation_args:
  negative_prompt: "lowres, text, error, cropped, worst quality, low quality, jpeg artifacts, signature, watermark, blurry"
  debug_dir: null
  val_debug: false
  num_images_per_prompt: 1
  num_inference_steps: 50
  guidance_scale: 5
  height: 1024
  width: 1024
  target_size: [1024, 1024]
  original_size: [1024, 1024]
  crops_coords_top_left: [0, 0]
  use_branched_attention: true
  face_embed_strategy: id
  photomaker_start_step: 10
  photomaker_use_lora_adapter: false
  merge_start_step: 10
  branched_attn_start_step: 15
  mask_expansion_ratio: 1.0
  mask_softness: 0.0
  branched_start_mode: both
  auto_mask_ref: false
  use_dynamic_mask: false
  use_bbox_mask_ref: true
  use_bbox_mask_gen: true
  gen_bbox_retrack: false
  gen_bbox_retrack_every: 6
  gen_bbox_retrack_min_frac: 0.5

disable_branched_sa: false
disable_branched_ca: false
strict_face_routing: false
ba_patch_top_k: 1.0
ba_uncond_face_fix: true
ba_face_prompt_mode: id_only
enable_vae_tiling: false

# Gen face boxes: use the DETERMINISTIC precomputed pm96 map (8 ids x 12 prompts = 96 entries,
# includes the Reading_pa_jensen force_manual fix). automatic_bboxes=false -> no per-image YOLO/PM
# preview pass, so this is faster AND every run scores on identical gen masks (only the branched
# face differs). The dataset (restrict_ids_to_gen_bbox=true) enumerates ONLY the 8 identities in
# this map -> exactly 96 images (not 144 from a 12-identity references/ folder).
automatic_bboxes: false
automatic_bboxes_every_val: false
face_detector: yolo
face_model: bbox_utils/yolov8n-face.pt
bbox_mask_gen_path: ../dataset_full/val_dataset/pm96_bboxes_new.json

saved_checkpoint: null      # set per-run by run_full_validation.sh
output_dir: full_validation_results/_tmp   # set per-run
batch_size: 1

dataset:
  _target_: src.datasets.manual_val.ManualPhotoMakerValDataset
  images_dir: ../dataset_full/val_dataset/references          # FULL 8-identity set
  prompts_path: ../dataset_full/val_dataset/prompts_10.txt
  classes_json_path: ../dataset_full/val_dataset/classes_ref.json
  bbox_mask_ref: ../dataset_full/val_dataset/ref_bboxes.json
  bbox_mask_gen: ../dataset_full/val_dataset/pm96_bboxes_new.json
  restrict_ids_to_gen_bbox: true   # -> only the 8 pm96 identities = 96 images (not 144)
  seeds: [0]
  limit: null
