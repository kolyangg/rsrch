defaults:
  - controlled_identity_factorial_rhca
  - _self_

# Data-only follow-up to Task D. Defaults are the exact winning multi_cosref
# arm; launchers change one explicit reference representation at a time.
controlled_factorial:
  target_mode: multi
  reference_mode: cosmic_256
  reference_crop_margin: null
  reference_content_size: null
  reference_canvas_size: null
  reference_canvas_fill: 127

datasets:
  train:
    controlled_identity_factorial:
      target_mode: ${controlled_factorial.target_mode}
      reference_mode: ${controlled_factorial.reference_mode}
      reference_crop_margin: ${controlled_factorial.reference_crop_margin}
      reference_content_size: ${controlled_factorial.reference_content_size}
      reference_canvas_size: ${controlled_factorial.reference_canvas_size}
      reference_canvas_fill: ${controlled_factorial.reference_canvas_fill}

trainer:
  n_epochs: 8
  masked_loss_step: 1
