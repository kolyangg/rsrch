defaults:
  - CL9_cosmic_joint_shadow_sa128_refscale_24k
  - _self_

# CL11 = CL9 + multi-reference PhotoMaker identity conditioning.
#
# CL9 fixes face scale but sits .0077 below CL4 on id_sim. Every cosmic target
# carries 2-10 same-person 256px crops, and a tight crop is the ideal input for
# the ID lane - the consumer that does not care about spatial scale, which CL9
# has already repaired on the spatial lane. E18 gave +.03735 from this mechanism.
#
# Invariant: ref_images[0] remains the sole spatial latent/KV lane; the extra
# crops contribute ID tokens only.
datasets:
  train:
    cosmic_large_adapted:
      num_identity_refs: 3

model:
  # The batched conditioning path asserts exactly one reference per sample, so
  # multi-reference runs use the per-sample path, exactly as E19 does.
  batched_conditioning_preparation: false

writer:
  experiment_comment: >-
    CL11 = CL9 reference face scale/position jitter plus three same-target
    PhotoMaker identity references, recovering identity without disturbing the
    repaired spatial geometry. Primary metric is undersized-face count.
