defaults:
  - CL19_cosmic_true_soft_fullquery_router_24k
  - _self_

# 18 Aug 2026 - CL23 changes only CL19's routed reference-minus-native
# message: fixed low/high gains follow the real denoising progress.
model:
  ba_hardcase_mode: temporal_frequency
  ba_hardcase_groups:
    - down_blocks.0
    - down_blocks.1
    - down_blocks.2
    - mid_block
    - up_blocks.0
    - up_blocks.1
    - up_blocks.2
  ba_hardcase_frequency_low_early: 0.50
  ba_hardcase_frequency_low_late: 0.85
  ba_hardcase_frequency_high_early: 0.75
  ba_hardcase_frequency_high_late: 1.25
  # Fixed-pipeline requirement: omit detached full-activation reductions.
  ba_hardcase_telemetry_enabled: false
  ba_frequency_surface_loss_enabled: false

writer:
  loss_names: [loss]
  experiment_comment: >-
    CL23 clean replay: CL19 full target/reference messages with a fixed
    denoising-progress schedule over low/high reference-minus-native bands.
