defaults:
  - E13_large_ds_joint_shadow_sa128_24k
  - _self_

# CL3: exact E13 contract on cosmic_large with the native 256px reference, and
# the 2.12x reference/target face-scale mismatch corrected in FEATURE space via
# the existing defaults-off bbox-frame reference ROI warp. This flag is pinned
# false in large_dataset_rhca_hard_v1_audited_20k, so E1-E24 are unaffected.
# Unlike CL1/CL2 it changes the step-zero route; declare its step-zero value.
train_dataset_name: cosmic_large_adapted
val_datasets_names: [manual_val]

model:
  ba_hard_v1_reference_roi_warp: true

datasets:
  train:
    cosmic_large_adapted:
      min_face_res: 192
      # Complete existing 256px asset, unchanged geometry.
      reference_crop_margin: null
      reference_content_size: 256
      reference_canvas_size: null
      reference_frame_mode: native
      random_horizontal_flip: true
      random_reference_flip: false
      prompt_mode: pose_first
      prompt_max_words: 50
  val:
    manual_val:
      limit: 96

writer:
  experiment_comment: >-
    CL3: exact E13 route on cosmic_large keeping the native 256px reference and
    correcting the measured 2.12x reference/target face-scale mismatch in
    feature space via bbox-frame reference ROI warping. Contingency arm; it
    changes the step-zero route, unlike CL1 and CL2.
