defaults:
  - CL27_cosmic_frequency_surface_energy_24k
  - _self_

model:
  clean_full_config:
    hardcase:
      telemetry_enabled: false
    recent_extension:
      kind: landmark_canonical_kv
      groups: [up_blocks.0, up_blocks.1]
      mix: 0.50
      min_confidence: 0.80

trainer:
  active_grad_norm_mode: requested_only

writer:
  loss_names:
    - loss
    - loss_ba_aux
    - loss_ba_frequency_surface
    - ba/canonical_kv/applied_fraction/all
    - ba/canonical_kv/landmark_confidence/all
    - ba/canonical_kv/native_vs_canonical_cosine/all
    - ba/canonical_kv/correction_rms/all
  experiment_comment: >-
    CL41 vs CL27 adds only parameter-free five-landmark canonicalization of
    reference K/V; missing or invalid metadata falls back to CL27.
