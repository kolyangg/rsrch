defaults:
  - CL27_cosmic_frequency_surface_energy_24k
  - _self_

model:
  clean_full_config:
    hardcase:
      telemetry_enabled: false
    recent_extension:
      kind: semantic_window_gate
      groups: [up_blocks.0, up_blocks.1]
      progress_start: 0.20
      progress_end: 0.85
      progress_temperature: 0.08
      agreement_threshold: 0.15
      agreement_temperature: 0.08
      min_scale: 0.60
      max_scale: 1.15

trainer:
  active_grad_norm_mode: requested_only

writer:
  loss_names:
    - loss
    - loss_ba_aux
    - loss_ba_frequency_surface
    - ba/semantic_window/agreement/all
    - ba/semantic_window/time_weight/all
    - ba/semantic_window/high_scale/all
    - ba/semantic_window/object_minus_visible_scale/all
  experiment_comment: >-
    CL44 vs CL27 adds only a parameter-free sample/time gate on the risky
    high-frequency reference lane; the low band stays unchanged.
