defaults:
  - large_dataset_rhca_40k
  - _self_

# Controlled replay of r4's observed fail-open ownership. This is a historical
# control, not an eligible BA-only promotion candidate.
model:
  strict_branched_install: false
  strict_trainable_contract: false
  branched_state_dict_mode: legacy
  ba_enforce_reference_only_hard_route: false

trainer:
  epoch_len: 2000
  n_epochs: 10
  validation_interval_steps: 2000
  save_period: 1
  skip_initial_validation: false
  log_per_image_id_sim_table: true
  face_quality:
    expected_images: 96

weights_only_save_period: 1

writer:
  project_name: aug-large-ds
  experiment_comment: >-
    Historical observed-r4 ownership parent; not intended for direct launch.
  require_online_registration: true

# Historical alternate-base behavior and incomplete legacy state format are
# deliberate parts of this control.
validation_processor_base_mode: legacy_full_copy
strict_validation_processor_copy: false
update_proc_weights_val: true

pipeline:
  pose_adapt_ratio: 0.0
  ca_mixing_for_face: false

# The old inclusion-only 840/840 check missed these two broad adapter groups.
# This independent exact partition makes the accidental behavior reproducible
# and fails if a later code repair silently changes it.
expected_trainable_contract:
  enabled: true
  total_tensors: 3080
  total_parameters: 171294720
  optimizer_tensors: 3080
  optimizer_parameters: 171294720
  categories:
    branched_processors:
      name_substring: ".processor."
      tensors: 840
      parameters: 31948800
    generic_lora_adapter:
      name_substring: ".lora_adapter."
      tensors: 1120
      parameters: 46448640
    photomaker_default_adapter:
      name_substring: ".default."
      tensors: 1120
      parameters: 92897280
